@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oranienbaum&display=swap');

:root {
  /* Tokens Oficiais TOSB - Paleta Exclusiva da Tabela */
  --tosb-green-950: #07180F;
  --tosb-green-900: #0B2418;
  --tosb-green-800: #123523;
  --tosb-green-700: #214B33;

  --tosb-gold-700: #9A6A18;
  --tosb-gold-600: #B68A35;
  --tosb-gold-500: #D0A54E;
  --tosb-gold-300: #E8CC8D;

  --tosb-cream-50: #FFFDF8;
  --tosb-cream-100: #FAF2E6;
  --tosb-cream-200: #F3EADA;
  --tosb-cream-300: #DDD2BD;
  --tosb-ink: #121913;
  --tosb-muted: #625E54;
  --tosb-white: #FFFFFF;

  /* Mapeamento de Variáveis Globais (Usando Apenas Cores da Tabela) */
  --gradient-brand: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-sidebar-bg) 100%);
  --gradient-placeholder: linear-gradient(135deg, #B3B6A8 0%, #82A591 100%);
  --color-primary: #1C5F20;
  --color-primary-light: #39733C;
  --color-secondary: #0B2B18;
  --color-accent: #D3702C;
  --color-sidebar-bg: #26402B;
  --color-bg-base: #F1EDE6;
  --color-bg-card: #FFFFFF;
  --color-text-main: #383838;
  --color-text-muted: #383838;
  --color-border: #B3B6A8;

  /* Mensagens de Sucesso, Erro e Aviso (Exceções autorizadas pelo usuário) */
  --color-success: #166534;
  --color-error: #9f1239;
  --color-warning: #9a3412;

  /* Acessibilidade */
  --font-multiplier: 1;

  /* Tipografia */
  --font-serif: 'Oswald', Georgia, serif;
  --font-sans: 'Montserrat', Arial, sans-serif;
  --font-menu: 'Bebas Neue', sans-serif;

  /* Tamanhos de Fonte (Acessibilidade Inclusa) */
  --fs-xs: calc(0.75rem * var(--font-multiplier, 1));
  --fs-sm: calc(0.85rem * var(--font-multiplier, 1));
  --fs-base: calc(0.95rem * var(--font-multiplier, 1));
  --fs-md: calc(1rem * var(--font-multiplier, 1));
  --fs-lg: calc(1.15rem * var(--font-multiplier, 1));
  --fs-xl: calc(1.25rem * var(--font-multiplier, 1));
  --fs-2xl: calc(1.5rem * var(--font-multiplier, 1));
  --fs-3xl: calc(1.75rem * var(--font-multiplier, 1));
  --fs-4xl: calc(2rem * var(--font-multiplier, 1));
  --fs-5xl: calc(2.5rem * var(--font-multiplier, 1));
  --fs-6xl: calc(3rem * var(--font-multiplier, 1));

  /* Efeitos */
  --shadow-sm: 0 2px 8px rgba(7, 24, 15, 0.06);
  --shadow-md: 0 6px 18px rgba(7, 24, 15, 0.10);
  --shadow-lg: 0 12px 28px rgba(7, 24, 15, 0.16);
  --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --border-radius-sm: 8px;
  --border-radius-md: 14px;
  --border-radius-lg: 22px;
}

@media (max-width: 400px) {
  :root {
    --fs-6xl: calc(2.5rem * var(--font-multiplier, 1));
    --fs-5xl: calc(2rem * var(--font-multiplier, 1));
    --fs-4xl: calc(1.75rem * var(--font-multiplier, 1));
    --fs-3xl: calc(1.5rem * var(--font-multiplier, 1));
    --fs-2xl: calc(1.25rem * var(--font-multiplier, 1));
  }
}


/* Reset básico */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px !important;
}

body {
  font-family: var(--font-sans);
  background-color: var(--color-bg-base);
  color: var(--color-text-main);
  font-size: var(--fs-md);
  font-weight: 500;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
h4 {
  font-family: var(--font-serif);
  color: var(--color-secondary);
  font-weight: 600;
}

/* Regras de Tipografia base para temas v2 e v3 (TOSB) */
.theme-tosb-v2 h1,
.theme-tosb-v2 h2,
.theme-tosb-v2 h3,
.theme-tosb-v2 .section-title,
.theme-tosb-v2 .hero-title {
  font-family: var(--font-display);
  color: var(--tosb-green-950);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.theme-tosb-v2 h4,
.theme-tosb-v2 h5,
.theme-tosb-v2 h6 {
  font-family: var(--font-ui);
  color: var(--tosb-green-900);
  font-weight: 600;
}

.theme-tosb-v2 p,
.theme-tosb-v2 span,
.theme-tosb-v2 div,
.theme-tosb-v2 li {
  font-family: var(--font-ui);
}

.theme-tosb-v3 p,
.theme-tosb-v3 span:not(.logo-title):not(.layout-badge),
.theme-tosb-v3 li {
  font-family: 'Oranienbaum', serif !important;
}

.theme-tosb-v3 .nav-link,
.theme-tosb-v3 .btn,
.theme-tosb-v3 h1,
.theme-tosb-v3 h2,
.theme-tosb-v3 h3,
.theme-tosb-v3 h4,
.theme-tosb-v3 h5,
.theme-tosb-v3 h6,
.theme-tosb-v3 .badge-paid,
.theme-tosb-v3 .badge-pending,
.theme-tosb-v3 .badge-overdue {
  font-family: var(--font-display) !important;
  letter-spacing: 0.05em;
}

.theme-tosb-v3 h1,
.theme-tosb-v3 h2,
.theme-tosb-v3 h3,
.theme-tosb-v3 h4,
.theme-tosb-v3 h5,
.theme-tosb-v3 h6,
.theme-tosb-v3 .form-label,
.theme-tosb-v3 label {
  color: #795738;
}

/* Layout Geral */
.app-container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Cabeçalho TOSB Premium */
.tosb-header {
  background-color: var(--color-primary);
  border-bottom: 2px solid var(--color-sidebar-bg);
  padding: 0.5rem 2rem 0.5rem 0rem;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.tosb-header .btn-secondary,
.tosb-header .layout-switcher-pill,
.tosb-header .btn-primary,
.tosb-header .btn {
  background-color: transparent !important;
  border-color: transparent !important;
  box-shadow: none !important;
  color: white !important;
}

.tosb-header .btn-secondary:hover,
.tosb-header .layout-switcher-pill:hover,
.tosb-header .btn:hover {
  background-color: var(--color-primary-light) !important;
  border-color: transparent !important;
  color: white !important;
}

.logo-container {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  padding: 0 3rem;
}

.logo-symbol {
  font-size: var(--fs-3xl);
}

.logo-text {
  display: flex;
  flex-direction: column;
}

.logo-title {
  font-family: var(--font-serif);
  font-size: var(--fs-xl);
  font-weight: bold;
  color: white;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.logo-subtitle {
  font-size: var(--fs-xs);
  letter-spacing: 0.15em;
  color: white;
  text-transform: uppercase;
}

/* Navegação */
.nav-links {
  display: flex;
  gap: 1.5rem;
  align-items: center;
}

.nav-link {
  text-decoration: none;
  color: white;
  background-color: transparent;
  border: none;
  font-family: var(--font-menu);
  font-weight: 500;
  font-size: var(--fs-md);
  transition: var(--transition-smooth);
  padding: 0.5rem 0.75rem;
  border-radius: var(--border-radius-sm);
  cursor: pointer;
}

.nav-link:hover,
.nav-link.active {
  color: white;
  background-color: var(--color-primary-light);
}

/* Botões */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.6rem 1.25rem;
  font-family: var(--font-menu);
  font-size: var(--fs-md);
  font-weight: 500;
  border-radius: var(--border-radius-md);
  border: none;
  cursor: pointer;
  transition: var(--transition-smooth);
  text-decoration: none;
  gap: 0.5rem;
}

.btn-primary {
  background-color: var(--color-primary);
  color: white;
}

.btn-primary:hover {
  background-color: var(--color-primary-light);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(6, 78, 59, 0.2);
}

/* ==================== BUTTON SECONDARY ==================== */

/* Design 1 (Clássico) */
.btn-secondary {
  background-color: white;
  border: 1px solid var(--color-border);
  color: var(--color-text-main);
}

.btn-secondary:hover {
  background-color: var(--color-bg-base);
  border-color: transparent;
}

/* Design 2 (Guia TOSB) */
.theme-tosb-v2 .btn-secondary {
  background-color: white;
  color: var(--tosb-green-950);
  border-radius: var(--radius-md);
  font-family: var(--font-menu);
  font-weight: 500;
  transition: all 220ms ease;
}

.theme-tosb-v2 .btn-secondary:hover {
  background-color: var(--tosb-cream-200);
  color: var(--tosb-green-900);
}

/* Design 3 (Novo) */
.theme-tosb-v3 .btn-secondary,
.theme-tosb-v3 .layout-switcher-pill {
  background-color: #FFFFFF !important;
  border: 2px solid #9BB19B !important;
  color: #91AD61 !important;
}

.theme-tosb-v3 .btn-secondary:hover,
.theme-tosb-v3 .layout-switcher-pill:hover {
  background-color: #9BB19B !important;
  color: #394D25 !important;
}

/* ========================================================== */

.btn-danger {
  background-color: var(--color-error);
  color: white;
}

.btn-danger:hover {
  background-color: #9d0c32;
}

/* Cards Premium */
.card {
  background-color: var(--color-bg-card);
  border-radius: var(--border-radius-lg);
  border: 1px solid var(--color-border);
  padding: 1.75rem;
  box-shadow: var(--shadow-md);
  transition: var(--transition-smooth);
}

.card-hover:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--color-primary-light);
}

/* Grid layout */
.grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1.5rem;
}

/* Containers e Áreas principais */
.main-content {
  flex: 1;
  padding: 2.5rem 2rem;
  width: 100%;
  margin: 0 auto;
  margin-top: 100px;
}

/* Rodapé Sophisticated */
.tosb-footer {
  background-color: var(--color-secondary);
  color: white;
  padding: 3rem 2rem 1.5rem;
  margin-top: auto;
  border-top: 4px solid var(--color-sidebar-bg);
}

.footer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 2.5rem;
  max-width: 1200px;
  margin: 0 auto;
  padding-bottom: 2rem;
  border-bottom: 1px solid var(--color-primary);
}

.footer-section h4 {
  color: white;
  margin-bottom: 1.25rem;
  font-size: var(--fs-lg);
}

.footer-links {
  list-style: none;
}

.footer-link {
  color: white;
  text-decoration: none;
  font-size: var(--fs-sm);
  display: block;
  margin-bottom: 0.6rem;
  transition: var(--transition-smooth);
}

.footer-link:hover {
  padding-left: 4px;
}

.footer-bottom {
  max-width: 1200px;
  margin: 0 auto;
  padding-top: 1.5rem;
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-sm);
  flex-wrap: wrap;
  gap: 1rem;
}

/* Alertas estilo GitHub */
.alert {
  padding: 1rem 1.25rem;
  border-radius: var(--border-radius-md);
  margin-bottom: 1.5rem;
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  font-size: var(--fs-base);
}

.alert-danger {
  background-color: #fff1f2;
  border: 1px solid #fecdd3;
  color: var(--color-error);
}

.alert-success {
  background-color: #f0fdf4;
  border: 1px solid #bbf7d0;
  color: var(--color-success);
}

.alert-warning {
  background-color: #fffbeb;
  border: 1px solid #fde68a;
  color: var(--color-warning);
}

/* Modais / Telas de Login */
.auth-box {
  max-width: 480px;
  width: 100%;
  margin: 3rem auto;
}

.auth-box-wide {
  max-width: 800px !important;
}

.form-group {
  margin-bottom: 1.25rem;
}

.form-label {
  display: block;
  font-size: var(--fs-sm);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-main);
  margin-bottom: 0.4rem;
}

.form-input {
  width: 100%;
  padding: 0.7rem 0.9rem;
  border-radius: var(--border-radius-md);
  border: 1px solid var(--color-border);
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  transition: var(--transition-smooth);
  background-color: #fafafa;
}

.form-input:focus {
  outline: none;
  background-color: white;
  box-shadow: 0 0 0 3px rgba(6, 78, 59, 0.1);
}

.terms-container {
  max-height: 150px;
  overflow-y: scroll;
  border: 1px solid var(--color-border);
  padding: 0.75rem;
  border-radius: var(--border-radius-sm);
  background-color: #f8fafc;
  font-size: var(--fs-sm);
  margin-bottom: 0.75rem;
}

/* Estilos de Player e Quiz */
.player-container {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  /* 16:9 Aspect Ratio */
  background-color: #000;
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  margin-bottom: 1.5rem;
}

.player-video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.quiz-container {
  background-color: var(--color-bg-card);
  padding: 2rem;
  border-radius: var(--border-radius-lg);
  border: 1px solid var(--color-border);
  margin-top: 2rem;
}

.quiz-question-card {
  margin-bottom: 1.75rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px dashed var(--color-border);
}

.quiz-question-text {
  font-size: var(--fs-md);
  margin-bottom: 1rem;
  color: var(--color-secondary);
}

.quiz-option-label {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-md);
  margin-bottom: 0.5rem;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.quiz-option-label:hover {
  background-color: var(--color-primary-light);
  border-color: var(--color-primary);
}

.quiz-option-label.selected {
  background-color: var(--color-primary-light);
  border-color: var(--color-primary);
  font-weight: 600;
}

/* Responsividade simples */
@media (max-width: 768px) {
  .nav-links {
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .main-content {
    padding: 1.5rem 1rem;
  }

  .installment-row {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 1rem !important;
  }

  .installment-row-info {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 0.5rem !important;
    width: 100% !important;
  }

  .installment-row-actions {
    width: 100% !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 0.75rem !important;
  }
}

/* --- Classes utilitárias e semânticas refatoradas de App.jsx --- */

/* Badge de Modo de Simulação */
.offline-mode-badge {
  background-color: #fffbeb;
  border: 1px solid #fde68a;
  color: #b45309;
  padding: 0.25rem 0.75rem;
  border-radius: 20px;
  font-size: var(--fs-sm);
  font-weight: bold;
}

/* Identificadores e Textos Auxiliares */
.user-greeting {
  font-size: var(--fs-base);
  color: var(--color-text-muted);
}

.main-content-top {
  padding-bottom: 0;
}

.text-center {
  text-align: center;
}

.w-full {
  width: 100%;
}

.flex-1 {
  flex: 1;
}

.flex-2 {
  flex: 2;
}

.cursor-pointer {
  cursor: pointer;
}

.pointer-events-none {
  pointer-events: none;
}

/* Margens utilitárias */
.mb-1 {
  margin-bottom: 0.25rem;
}

.mb-2 {
  margin-bottom: 0.5rem;
}

.mb-3 {
  margin-bottom: 0.75rem;
}

  margin-bottom: 1rem;
}

  margin-bottom: 1.5rem;
}

.mb-6 {
  margin-bottom: 2rem;
}

.mb-7 {
  margin-bottom: 2.5rem;
}

.mt-1 {
  margin-top: 0.25rem;
}

  margin-top: 0.5rem;
}

  margin-top: 0.75rem;
}

  margin-top: 1rem;
}

  margin-top: 1.5rem;
}

.mt-6 {
  margin-top: 2rem;
}

/* Grid e Flex Layouts Gerais */
.flex-center-gap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.grid-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.grid-2col-wide {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

.dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.dashboard-layout {
  display: grid;
  grid-template-columns: 3fr 1fr;
  gap: 2rem;
}

.section-title-underlined {
  margin-bottom: 1rem;
  border-bottom: 2px solid var(--color-primary-light);
  padding-bottom: 0.5rem;
}

.section-title-underlined-thin {
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--color-border);
  padding-bottom: 0.5rem;
}

/* Assistente de Login Rápido */
.quick-login-container {
  background-color: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 0.75rem;
  margin-bottom: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.quick-login-title {
  font-size: var(--fs-xs);
  font-weight: bold;
  color: var(--color-primary);
  text-transform: uppercase;
}

.quick-login-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.btn-quick-login {
  padding: 0.25rem 0.5rem;
  font-size: var(--fs-md);
}

.helper-text {
  font-size: var(--fs-xs);
  color: #64748b;
}

/* Trava de IP no Login */
.ip-warning-container {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background-color: #fff1f2;
  padding: 0.5rem;
  border-radius: 6px;
  border: 1px solid #fecdd3;
}

.ip-warning-label {
  font-size: var(--fs-sm);
  color: var(--color-error);
  cursor: pointer;
}

/* Card de Largura Larga (Cadastro) */
.auth-box-wide {
  max-width: 600px;
}

/* Grade de Cursos */
.courses-list {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.course-card-grid {
  display: grid;
  grid-template-columns: 3fr 1fr;
  gap: 1.5rem;
  align-items: center;
}

.course-type-badge {
  font-size: var(--fs-xs);
  font-weight: bold;
  color: var(--color-accent);
  text-transform: uppercase;
  display: block;
  margin-bottom: 0.25rem;
}

.course-card-title {
  font-size: var(--fs-xl);
  margin-bottom: 0.5rem;
}

.course-card-description {
  color: var(--color-text-muted);
  font-size: var(--fs-base);
  margin-bottom: 0.5rem;
}

.course-card-expires {
  font-size: var(--fs-sm);
  color: #64748b;
}

.course-card-actions {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  text-align: right;
}

.error-text-bold {
  color: var(--color-error);
  font-weight: bold;
  font-size: var(--fs-sm);
}

.muted-text-bold {
  color: var(--color-text-muted);
  font-weight: bold;
  font-size: var(--fs-sm);
}

/* Financeiro / Invoices */
.invoices-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.invoice-card {
  border: 1px solid var(--color-border);
  border-radius: 8px;
  padding: 0.75rem;
  background-color: #fff;
  font-size: var(--fs-sm);
}

.invoice-title {
  font-weight: bold;
  margin-bottom: 0.25rem;
}

.invoice-details {
  color: var(--color-text-muted);
  margin-bottom: 0.5rem;
}

.invoice-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.badge-paid {
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-size: var(--fs-xs);
  font-weight: bold;
  background-color: #dcfce7;
  color: #166534;
}

.badge-pending {

  border-radius: 4px;
  font-size: var(--fs-xs);
  font-weight: bold;
  background-color: #e2e8f0;
  color: #475569;
}

.badge-overdue {
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-size: var(--fs-xs);
  font-weight: bold;
  background-color: #fee2e2;
  color: #991b1b;
}

.invoice-ref {
  display: block;
  margin-top: 0.5rem;
  color: #64748b;
}

.invoice-due {
  display: block;
  color: #64748b;
}

/* Checkout */
.checkout-item-title {
  font-size: var(--fs-xl);
  font-weight: bold;
  color: var(--color-primary);
  margin-top: 0.5rem;
}

.checkout-actions {
  display: flex;
  gap: 1rem;
  margin-top: 1.5rem;
}

/* LMS Layout & Player */
.lms-layout {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 2rem;
}

.lesson-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
}

.lesson-progress-meta {
  display: flex;
  gap: 1rem;
  align-items: center;
}

.lesson-progress-badge-completed {
  padding: 0.2rem 0.5rem;
  border-radius: 20px;
  font-size: var(--fs-xs);
  font-weight: bold;
  background-color: #dcfce7;
  color: #166534;
}

.lesson-progress-badge-pending {
  padding: 0.2rem 0.5rem;
  border-radius: 20px;
  font-size: var(--fs-xs);
  font-weight: bold;
  background-color: #f1f5f9;
  color: #64748b;
}

.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

}

.quiz-attempts-list {

  margin-top: 0.5rem;
  padding-left: 1.25rem;
}

.quiz-attempt-passed {
  color: var(--color-success);
}

.quiz-attempt-failed {
  color: var(--color-error);
}

.placeholder-box {
  border: 2px dashed var(--color-border);
  border-radius: 12px;
  padding: 3rem;
  text-align: center;
  color: var(--color-text-muted);
}

.course-conclusion-card {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-top: 2rem;
  border-left: 8px solid var(--color-success);
}

.lms-sidebar {
  border-left: 1px solid var(--color-border);
  padding-left: 1.5rem;
}

.sidebar-title {
  font-size: var(--fs-lg);
  margin-bottom: 1rem;
}

.modules-list-container {
  margin-bottom: 1.5rem;
}

.module-header-title {
  font-weight: bold;
  font-size: var(--fs-base);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-primary);
  margin-bottom: 0.5rem;
}

.lessons-list-container {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.lesson-item-sidebar {
  padding: 0.6rem 0.75rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: var(--fs-sm);
  border: 1px solid transparent;
  background-color: #fff;
  color: var(--color-text-main);
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
  transition: var(--transition-smooth);
}

.lesson-item-sidebar:hover {
  background-color: var(--color-primary-light);
  border-color: var(--color-primary-light);
}

.lesson-item-sidebar.active {
  border-color: var(--color-primary);
  background-color: var(--color-primary-light);
  color: var(--color-primary);
}

/* Professor Dashboard */
.teacher-dash-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
}

.table-responsive {
  overflow-x: auto;
}

.lms-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: var(--fs-sm);
}

.lms-table th {
  padding: 0.75rem;
  border-bottom: 2px solid var(--color-border);
  color: var(--color-secondary);
}

.lms-table td {
  padding: 0.75rem;
  border-bottom: 1px solid var(--color-border);
}

.badge-status-active {
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-size: var(--fs-xs);
  font-weight: bold;
  background-color: #dcfce7;
  color: #166534;
}

.badge-status-suspended {
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-size: var(--fs-xs);
  font-weight: bold;
  background-color: #fee2e2;
  color: #991b1b;
}

/* Admin Dashboard */
.admin-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2.5rem;
}

.admin-stat-card {
  background-color: var(--color-bg-card);
  border-radius: var(--border-radius-lg);
  border: 1px solid var(--color-border);
  padding: 1.75rem;
  box-shadow: var(--shadow-md);
  transition: var(--transition-smooth);
}

.admin-stat-card.primary {
  border-left: 6px solid var(--color-primary);
}

.admin-stat-card.warning {
  border-left: 6px solid var(--color-warning);
}

.admin-stat-card.error {
  border-left: 6px solid var(--color-error);
}

.admin-stat-card.accent {
  border-left: 6px solid var(--color-accent);
}

.stat-value {
  font-size: var(--fs-3xl);
  margin-top: 0.5rem;
}

.admin-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

.ofx-textarea {
  min-height: 180px;
  font-family: monospace;
  font-size: var(--fs-xs);
  margin-bottom: 1rem;
}

.conciliation-results {
  margin-top: 1.5rem;
  background-color: #f8fafc;
  padding: 1rem;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  font-size: var(--fs-sm);
}

.logs-container {
  flex: 1;
  max-height: 350px;
  overflow-y: auto;
  border: 1px solid var(--color-border);
  border-radius: 8px;
  background-color: #f8fafc;
  padding: 0.5rem;
}

.log-item {
  border-bottom: 1px solid #e2e8f0;
  padding: 0.5rem 0;
  font-size: var(--fs-sm);
}

.badge-log-type {
  padding: 0.1rem 0.3rem;
  border-radius: 3px;
  font-size: var(--fs-xs);
  font-weight: bold;
  background-color: #e2e8f0;
  color: #475569;
}

.badge-log-type.lockout {
  background-color: #fee2e2;
  color: var(--color-error);
}

.footer-about-text {
  font-size: var(--fs-sm);
  line-height: 1.5;
}

.footer-contact-text {
  font-size: var(--fs-sm);
}

.font-serif-title {
  font-family: var(--font-serif);
}

.text-muted {
  color: var(--color-text-muted);
}

.flex-col {
  display: flex;
  flex-direction: column;
}

.quiz-section-wrapper {
  margin-top: 2rem;
  border-top: 2px solid var(--color-border);
  padding-top: 1.5rem;
}

/* ==========================================================================
   ACESSIBILIDADE E ALTO CONTRASTE (PÚBLICO IDOSO)
   ========================================================================== */

/* Seletor de Acessibilidade no Cabeçalho */
.accessibility-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background-color: var(--color-primary-light);
  padding: 0.35rem 0.75rem;
  border-radius: 20px;
  border: 1px solid var(--color-border);
}

.accessibility-popover-wrapper {
  position: relative;
  display: inline-block;
}

.accessibility-popover {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background-color: var(--color-primary);
  padding: 0.5rem 0.75rem;
  border-radius: 24px;
  border: 1px solid var(--color-secondary);
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  z-index: 1000;
  white-space: nowrap;
}

.accessibility-popover::after {
  content: '';
  position: absolute;
  bottom: 100%;
  right: 10px;
  border-width: 6px;
  border-style: solid;
  border-color: transparent transparent white transparent;
}

.btn-acc {
  background: transparent;
  border: 0;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-base);
  transition: var(--transition-smooth);
  color: white;
}

.btn-acc:hover {
  background-color: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

.btn-contrast {
  border-radius: 12px;
  padding: 0 0.75rem;
  width: auto;
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Sobrescritas de Alto Contraste */
body.high-contrast {
  --color-primary: #ffffff;
  --color-primary-light: #2d3748;
  --color-secondary: #ffff00;
  /* Amarelo sobre preto */
  --color-accent: #ffff00;
  --color-bg-base: #000000;
  --color-bg-card: #121212;
  --color-text-main: #ffffff;
  --color-text-muted: #e2e8f0;
  --color-border: #ffffff;
  --color-success: #00ff00;
  --color-error: #ff3333;
  --color-warning: #ffff00;
}

body.high-contrast * {
  border-color: #ffffff !important;
}

body.high-contrast .btn-primary {
  background-color: #ffff00 !important;
  color: #000000 !important;
  font-weight: 900 !important;
  border: 2px solid #ffffff !important;
}

body.high-contrast .btn-secondary {
  background-color: #000000 !important;
  color: #ffffff !important;
  border: 2px solid #ffffff !important;
}

body.high-contrast .lesson-item-sidebar.active {
  background-color: #ffff00 !important;
  color: #000000 !important;
}

body.high-contrast .nav-link:hover,
body.high-contrast .nav-link.active {
  background-color: #2d3748 !important;
  color: #ffff00 !important;
}

/* ==========================================================================
   PAINEL DO ALUNO: MENU LATERAL (SIDEBAR LAYOUT)
   ========================================================================== */
.student-panel-container {
  display: flex;
  gap: 2rem;
  align-items: flex-start;
  margin-top: 1rem;
}

.student-sidebar {
  width: 260px;
  background: var(--color-sidebar-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-lg);
  padding: 1rem;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.student-sidebar-menu {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.4rem;
  list-style: none;
  padding: 0;
  margin: 0;
}

.student-sidebar-item {
  list-style: none;
}

.student-sidebar-item button {
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  padding: 0.8rem 1rem;
  font-family: var(--font-menu);
  font-size: var(--fs-md);
  font-weight: 500;
  letter-spacing: 0.05em;
  color: white;
  border-radius: var(--border-radius-md);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.student-sidebar-item button:hover {
  background-color: var(--color-primary-light);
  color: white;
}

.student-sidebar-item.active button {
  background-color: var(--color-primary-light);
  color: white;
}

.student-panel-content {
  flex: 1;
  min-width: 200px;
  width: 100%;
  overflow-x: hidden;
}

.addresses-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}

@media (max-width: 900px) {
  .student-panel-container {
    flex-direction: column;
  }

  .student-sidebar {
    width: 100%;
  }

  .student-sidebar-menu {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 600px) {
  .student-sidebar-menu {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 440px) {
  .student-sidebar-menu {
    grid-template-columns: 1fr;
  }

  .student-sidebar-item button {
    padding: 0.6rem 0.8rem;
    font-size: var(--fs-sm);
  }

  .addresses-grid {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   PÁGINAS INSTITUCIONAIS E LAYOUTS
   ========================================================================== */

/* ==================== HERO SECTION ==================== */

/* Design 1 (Clássico) */
.hero-section {
  background: var(--gradient-brand);
  color: white;
  border-radius: var(--border-radius-lg);
  padding: 4rem 3rem;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  margin-bottom: 3rem;
  border-bottom: 4px solid var(--color-accent);
}

.hero-section h1,
.hero-section .hero-title {
  font-family: var(--font-serif);
  color: white !important;
  font-size: var(--fs-5xl);
  font-weight: 700;
  margin-bottom: 1rem;
}

.hero-section .hero-subtitle {
  font-size: var(--fs-lg);
  color: var(--color-bg-base);
  max-width: 700px;
  margin: 0 auto 2rem;
}

/* Design 2 (Guia TOSB) */
.theme-tosb-v2 .hero-section {
  border-radius: 22px;
  box-shadow: 0 12px 32px rgba(7, 24, 15, 0.15);
  border-bottom: 4px solid var(--tosb-gold-500);
}

.theme-tosb-v2 .hero-section .hero-subtitle {
  color: var(--tosb-cream-200);
}

/* Design 3 (Novo) */
.theme-tosb-v3 .hero-section {
  border-radius: var(--border-radius-lg);
  box-shadow: none;
  border-bottom: 5px solid #91AD61;
}

.theme-tosb-v3 .hero-section h1,
.theme-tosb-v3 .hero-section .hero-title {
  font-family: 'Oranienbaum', serif !important;
  color: #FFFFFF !important;
}

/* ====================================================== */

/* Dropdown Menu para Cursos/Quem Somos */
.nav-dropdown {
  position: relative;
  display: inline-block;
}

.nav-dropdown-content {
  display: none;
  position: absolute;
  background-color: var(--color-sidebar-bg);
  min-width: 200px;
  box-shadow: var(--shadow-lg);
  border: 2px solid var(--color-sidebar-bg);
  border-top: 0;
  z-index: 200;
  top: 100%;
  left: 0;
  margin-top: 0.5rem;
  overflow: hidden;
}

.nav-dropdown-content.open {
  display: block;
}

.dropdown-item {
  color: white;
  padding: 0.75rem 1rem;
  text-decoration: none;
  display: block;
  font-family: var(--font-menu);
  font-size: var(--fs-md);
  font-weight: 500;
  transition: var(--transition-smooth);
}

.dropdown-item:last-child {
  border-bottom: none;
}

.dropdown-item:hover {
  background-color: var(--color-primary-light);
  color: white;
}

/* Cursos Grid (Página Inicial e Loja) */
.home-section-title {
  text-align: center;
  font-size: var(--fs-4xl);
  margin-bottom: 2rem;
  position: relative;
}

.home-section-title::after {
  content: '';
  display: block;
  width: 60px;
  height: 3px;

  margin: 0.5rem auto 0;
}

.premium-card-grid {

  flex-wrap: wrap;
  gap: 2rem;
  margin-bottom: 3rem;
  justify-content: center;
}

.premium-card {
  background-color: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  transition: var(--transition-smooth);
  display: flex;
  flex-direction: column;
  max-width: 502px;
  width: calc(33.333% - 1.34rem);
}

@media (max-width: 1034px) {

    width: calc(50% - 1rem);

}

@media (max-width: 668px) {

.premium-card:hover {

.premium-card-img-placeholder {

.premium-card-content {

  flex: 1;

  flex-direction: column;
}

.premium-card-tag {
  align-self: flex-start;
  background-color: var(--color-bg-base);
  color: var(--color-accent);
  font-size: var(--fs-xs);
  font-weight: 700;
  padding: 0.25rem 0.6rem;
  border-radius: 4px;
  text-transform: uppercase;
  margin-bottom: 0.75rem;
}

.premium-card-title {
  font-size: var(--fs-xl);
  margin-bottom: 0.75rem;
  color: var(--color-secondary);

.premium-card-text {
  font-size: var(--fs-base);
  color: var(--color-text-muted);

.premium-card-footer {

.premium-card-price {

  .premium-card-price {
    text-align: center;
    width: 100%;
    display: inline-block;
  }

/* Vídeo Institucional */
.video-section-home {

.video-section-content h3 {

.video-section-content p {

.video-wrapper-embed {

  padding: 1.5rem;

.homeopath-avatar {

  height: 60px;
  background-color: var(--color-primary-light);
  color: var(--color-primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-2xl);
  font-weight: bold;
  flex-shrink: 0;
}

.homeopath-info h4 {
  font-size: var(--fs-lg);
  margin-bottom: 0.25rem;
}

.homeopath-reg {
  font-size: var(--fs-xs);
  background-color: #f1f5f9;
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-weight: bold;
  color: #475569;
  display: inline-block;
  margin-bottom: 0.5rem;
}

.homeopath-contact-item {
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
  margin-bottom: 0.2rem;
}

/* Galeria de Fotos */
.gallery-grid-photos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}

.gallery-item {
  position: relative;
  border-radius: var(--border-radius-md);
  overflow: hidden;
  height: 300px;
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
}

.gallery-placeholder-img {
  width: 100%;
  height: 100%;
  background: var(--gradient-placeholder);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-6xl);
  color: #94a3b8;
  transition: var(--transition-smooth);
}

.gallery-item:hover .gallery-placeholder-img {
  transform: scale(1.05);
}

.gallery-caption {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background: var(--gradient-brand);
  color: white;
  padding: 0.75rem;
  font-size: var(--fs-sm);
  font-weight: 600;
  text-align: center;
}

/* Carrinho de Compras */
.cart-badge-nav {
  position: relative;
  display: flex;
  align-items: center;
}

.cart-count {
  position: absolute;
  top: -8px;
  right: -8px;
  background-color: var(--color-error);
  color: white;
  font-size: var(--fs-xs);
  border-radius: 50%;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cart-layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 2rem;
}

@media (max-width: 800px) {
  .cart-layout {
    grid-template-columns: 1fr;
  }
}

.cart-items-list {
  background-color: white;
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-lg);
  padding: 1.5rem;
}

.cart-item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 0;
  border-bottom: 1px solid #f1f5f9;
}

.cart-item-row:last-child {
  border-bottom: none;
}

.cart-item-title-section {
  flex: 1;
}

.cart-item-actions {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.cart-quantity-selector {
  display: flex;
  align-items: center;
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-sm);
  overflow: hidden;
}

.btn-qty {
  background-color: #f1f5f9;
  border: none;
  width: 20px;
  height: 28px;
  font-weight: bold;
  cursor: pointer;
}

.cart-qty-value {
  padding: 0 0.5rem;
  font-size: var(--fs-sm);
  font-weight: 600;
}

.btn-remove-cart {
  background: transparent;
  border: none;
  color: var(--color-error);
  cursor: pointer;
  font-size: var(--fs-sm);
  text-decoration: underline;
  padding: 0.25rem;
}

.cart-summary-box {
  background-color: white;
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-lg);
  padding: 1.5rem;
  height: fit-content;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.75rem;
  font-size: var(--fs-sm);
}

.summary-total {
  border-top: 1px solid var(--color-border);
  padding-top: 1rem;
  font-weight: bold;
  font-size: var(--fs-lg);
  color: var(--color-primary);
  margin-top: 1rem;
}

/* ==========================================================================
   MELHORIAS DE RESPONSIVIDADE E NOVOS COMPONENTES
   ========================================================================== */

/* Botão do Menu Hamburger Mobile */
.hamburger-btn {
  display: none;
  background: transparent;
  border: none;
  font-size: var(--fs-2xl);
  cursor: pointer;
  color: var(--color-accent);
  padding: 0.5rem;
  align-items: center;
  justify-content: center;
}

/* Seções de Depoimentos na Livraria */
.testimonials-section {
  margin-top: 4rem;
  border-top: 2px solid var(--color-primary-light);
  padding-top: 3rem;
}

.testimonial-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
  margin-top: 1.5rem;
}

.testimonial-card {
  background-color: white;
  border-radius: var(--border-radius-md);
  padding: 1.5rem;
  border: 1px solid var(--color-border);
  font-size: var(--fs-base);
}

.testimonial-stars {
  color: var(--color-accent);
  margin-bottom: 0.5rem;
  font-size: var(--fs-lg);
}

.testimonial-author {
  font-weight: bold;
  margin-top: 0.75rem;
  font-size: var(--fs-sm);
  color: var(--color-primary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Seção de Agenda e Eventos na Livraria */
.agenda-section {
  margin-top: 4rem;
  border-top: 2px solid var(--color-primary-light);
  padding-top: 3rem;
}

.agenda-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 1.5rem;
}

.agenda-card {
  display: flex;
  background-color: white;
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.agenda-date-box {
  background-color: var(--color-primary);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem 1.5rem;
  min-width: 100px;
  text-align: center;
  font-weight: bold;
}

.agenda-date-day {
  font-size: var(--fs-3xl);
  line-height: 1;
}

.agenda-date-month {
  font-size: var(--fs-sm);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.agenda-details {
  padding: 1rem 1.5rem;
  flex: 1;
}

.agenda-type {
  font-size: var(--fs-xs);
  font-weight: bold;
  color: var(--color-accent);
  text-transform: uppercase;
  margin-bottom: 0.25rem;
}

.agenda-title {
  font-size: var(--fs-lg);
  font-weight: 600;
  margin-bottom: 0.25rem;
  color: var(--color-secondary);
}

.agenda-location {
  font-size: var(--fs-sm);
  color: var(--color-text-muted);
}

/* Página de Detalhes do Curso */
.course-detail-hero {
  background: var(--gradient-brand);
  color: white;
  border-radius: var(--border-radius-lg);
  padding: 3rem 2rem;
  margin-bottom: 2rem;
  border-bottom: 4px solid var(--color-accent);
}

.course-detail-hero h1 {
  color: white;
  font-family: var(--font-serif);
  font-size: var(--fs-4xl);
  margin-bottom: 0.5rem;
}

.course-detail-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 2rem;
  align-items: flex-start;
}

.syllabus-module-card {
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-md);
  margin-bottom: 1rem;
  background: white;
  overflow: hidden;
}

table.syllabus-module-card {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}

table.syllabus-module-card thead th,
.syllabus-module-header {
  background-color: var(--color-sidebar-bg);
  padding: 1rem;
  font-weight: bold;
  color: white;
  border-bottom: 1px solid var(--color-border);
  text-align: left;
}

table.syllabus-module-card tbody td {
  padding: 0.5rem 1rem;
  border-bottom: 1px dashed var(--color-border);
  font-size: var(--fs-base);
  border-left: none;
  border-right: none;
}

table.syllabus-module-card tbody tr:last-child td {
  border-bottom: none;
}

.syllabus-lessons-list {
  list-style: none;
  padding: 1rem;
}

.syllabus-lesson-item {
  padding: 0.5rem 0;
  border-bottom: 1px dashed var(--color-border);
  font-size: var(--fs-base);
}

.syllabus-lesson-item:last-child {
  border-bottom: none;
}

/* Rich Text Content */
.rich-text-content {
  font-size: var(--fs-base);
  line-height: 1.6;
  color: var(--color-text-main);
  width: 100%;
}

.rich-text-content p {
  margin-bottom: 1rem;
}

.rich-text-content a {
  color: var(--color-primary);
  text-decoration: underline;
}

.rich-text-content b,
.rich-text-content strong {
  font-weight: 700;
}

.rich-text-editor {
  min-height: 200px;
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-sm);
  padding: 1rem;
  background: white;
  overflow-y: auto;
  outline: none;
}

.rich-text-editor-container {
  border-radius: var(--border-radius-sm);
  transition: box-shadow 0.2s, border-color 0.2s;
}

.rich-text-editor-container:focus-within {
  outline: none;
  box-shadow: 0 0 0 3px rgba(6, 78, 59, 0.1);
}

.rich-text-editor:focus {
  outline: none;
}

.course-specs-table {
  width: 100%;
  border-collapse: collapse;
}

.course-specs-table td {
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--color-border);
  font-size: var(--fs-base);
}

.course-specs-table td:first-child {
  font-weight: bold;
  color: var(--color-primary);
}

.course-specs-table tr:last-child td {
  border-bottom: none;
}

@media (max-width: 400px) {
  .course-specs-table tr {
    display: flex;
    flex-direction: column;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--color-border);
  }

  .course-specs-table td {
    padding: 0.25rem 0;
    border-bottom: none;
  }

  .course-specs-table tr:last-child {
    border-bottom: none;
  }
}

.teacher-bio-card {
  display: flex;
  gap: 1rem;
  align-items: flex-start;
  margin-top: 1.5rem;
  background-color: var(--color-bg-card);
  padding: 1rem;
  border-radius: var(--border-radius-md);
}

.teacher-bio-avatar {
  width: 60px;
  height: 60px;
  border: 2px solid var(--color-primary);
  border-radius: 50%;
  background-color: var(--color-bg-base);
  color: var(--color-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-2xl);
  font-weight: bold;
  flex-shrink: 0;
}

/* ==========================================================================
   MEDIA QUERIES PARA DISPOSITIVOS MÓVEIS (CELULARES)
   ========================================================================== */

@media (max-width: 768px) {

  /* Header e Menu hamburger */
  .hamburger-btn {
    display: inline-flex;
  }

  .logo-container {
    padding: 0 1rem;
  }

  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    background-color: var(--color-bg-card);
    position: absolute;
    top: 100%;
    left: 0;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--color-border);
    box-shadow: var(--shadow-lg);
    z-index: 150;
    gap: 0.5rem;
    align-items: stretch;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
  }

  .nav-links.mobile-open {
    display: flex;
  }

  .nav-link {
    width: 100%;
    text-align: left;
    padding: 0.75rem 1rem;
    background-color: #f8fafc;
    border: 1px solid #f1f5f9;
  }

  .nav-dropdown {
    width: 100%;
  }

  .nav-dropdown-content {
    position: static;
    display: none;
    width: 100%;
    box-shadow: none;
    border: 1px solid var(--color-primary-light);
    border-radius: var(--border-radius-md);
    margin-top: 0.25rem;
    padding: 0.25rem;
  }

  .nav-dropdown-content.open {
    display: block;
  }

  .dropdown-item {
    padding: 0.75rem 1.25rem;
  }

  /* Ajustes de layouts de grid para 1 coluna */
  .grid-container,
  .testimonial-grid,
  .directory-grid,
  .gallery-grid-photos {
    grid-template-columns: 1fr !important;
  }

  .grid-2col,
  .grid-2col-wide {
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  .course-detail-grid {
    grid-template-columns: 1fr;
  }

  /* LMS Player responsivo */
  .lms-layout {
    grid-template-columns: 1fr;
  }

  .lms-sidebar {
    border-left: none;
    border-top: 1px solid var(--color-border);
    padding-left: 0;
    padding-top: 1.5rem;
    margin-top: 1.5rem;
  }

  /* Responsividade do Header ações de acessibilidade */
  .accessibility-bar {
    width: 100%;
    justify-content: center;
    margin-top: 0.5rem;
  }
}

@media (max-width: 480px) {
  .agenda-card {
    flex-direction: column;
  }

  .agenda-date-box {
    width: 100%;
    min-width: unset;
    padding: 0.75rem;
    flex-direction: row;
    gap: 0.5rem;
  }
}

/* Botão Flutuante do WhatsApp */
.whatsapp-float-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background-color: #25D366;
  color: white !important;
  border-radius: 50px;
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
  z-index: 9999;
  text-decoration: none !important;
  font-weight: 600;
  font-size: var(--fs-base);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.whatsapp-float-btn:hover {
  transform: translateY(-3px) scale(1.03);
  background-color: #20ba5a;
  box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
}

.whatsapp-icon-svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* Classes de Visibilidade Responsiva */
@media (min-width: 769px) {
  .mobile-only-block {
    display: none !important;
  }

  .mobile-only-flex {
    display: none !important;
  }
}

@media (max-width: 400px) {
  .hide-on-small-mobile {
    display: none !important;
  }
}

@media (max-width: 768px) {
  .desktop-only-block {
    display: none !important;
  }

  .mobile-only-flex {
    display: flex !important;
  }

  /* Ajustes do Cabeçalho Mobile para ser Sticky e Menor */
  .tosb-header {
    top: 0;
    z-index: 1000 !important;
    display: flex !important;
    flex-wrap: wrap;
    flex-direction: row !important;
    gap: 1rem;
    justify-content: space-between !important;
    align-items: center !important;
    padding: 0.5rem 1rem !important;
    box-shadow: var(--shadow-sm) !important;
  }

  .accessibility-bar {
    display: none !important;
  }

  .logo-title {
    display: none !important;
  }

  .logo-subtitle {
    display: none !important;
  }

  .logo-text::after {
    content: 'TOSB';
    font-family: var(--font-primary);
    font-weight: 700;
    font-size: var(--fs-xl);
    letter-spacing: 0.05em;
    color: var(--color-primary);
  }

  .logo-symbol {
    font-size: var(--fs-2xl) !important;
  }

  .nav-links {
    top: 55px !important;
    /* Ajusta para a altura do novo header menor */
  }
}

/* Transição do texto do WhatsApp */
.whatsapp-text {
  max-width: 150px;
  overflow: hidden;
  transition: max-width 0.5s ease, opacity 0.5s ease;
  white-space: nowrap;
  opacity: 1;
  display: inline-block;
}

.whatsapp-text.hidden {
  max-width: 0;
  opacity: 0;
}

.whatsapp-float-btn {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s ease, gap 0.5s ease !important;
}

.whatsapp-float-btn.text-hidden {
  padding: 0.75rem !important;
  gap: 0 !important;
}

/* Sistema de Toasts Flutuantes */
.tosb-toast-container {
  position: fixed;
  top: 75px;
  right: 20px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 400px;
  width: calc(100% - 40px);
}

.tosb-toast {
  padding: 0.85rem 1.25rem;
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  font-weight: 500;
  backdrop-filter: blur(10px);
  animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  color: #1e293b;
  font-size: var(--fs-base);
}

.tosb-toast.alert-success {
  background-color: rgba(240, 253, 244, 0.95);
  border: 1px solid rgba(34, 197, 94, 0.2);
  border-left: 5px solid #22c55e;
}

.tosb-toast.alert-danger {
  background-color: rgba(254, 242, 242, 0.95);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-left: 5px solid #ef4444;
}

.toast-close-btn {
  background: none;
  border: none;
  font-size: var(--fs-xl);
  cursor: pointer;
  color: var(--color-text-muted);
  line-height: 1;
  padding: 0;
  transition: color 0.2s ease;
}

.toast-close-btn:hover {
  color: #0f172a;
}

@keyframes slideIn {
  from {
    transform: translateX(120%);
    opacity: 0;
  }

  to {
    transform: translateX(0);
    opacity: 1;
  }
}

/* Correção do deslocamento do menu painel no mobile */
.header-mobile-actions .nav-dropdown-content {
  position: absolute !important;
  top: 100% !important;
  right: 0 !important;
  left: auto !important;
  display: none;
  min-width: 220px !important;
  background-color: var(--color-bg-card) !important;
  box-shadow: var(--shadow-lg) !important;
  border: 1px solid var(--color-border) !important;
  z-index: 10000 !important;
}

.header-mobile-actions .nav-dropdown-content.open {
  display: block !important;
}

/* Badges de Modalidade do Curso */
.badge-modality {
  display: inline-block;
  padding: 0.25rem 0.6rem;
  font-size: var(--fs-xs);
  font-weight: 600;
  border-radius: var(--border-radius-sm);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.badge-modality-online {
  background-color: #e0f2fe;
  color: #0369a1;
}

.badge-modality-presencial {
  background-color: #ffedd5;
  color: #c2410c;
}

.badge-modality-hibrido {
  background-color: #f3e8ff;
  color: #6b21a8;
}

/* Badges de Homeopatas */
.badge-homeopath-reg {
  display: inline-block;
  padding: 0.25rem 0.6rem;
  font-size: var(--fs-xs);
  font-weight: 600;
  border-radius: 4px;
  background-color: var(--color-bg-base);
  color: var(--color-accent);
}

.badge-homeopath-rqe {
  display: inline-block;
  padding: 0.25rem 0.6rem;
  font-size: var(--fs-xs);
  font-weight: 600;
  border-radius: 4px;
  background-color: var(--color-bg-base);
  color: var(--color-accent);
}

/* Trava de Prévia do Vídeo (20%) */
.video-player-container {
  position: relative;
  width: 100%;
  border-radius: var(--border-radius-md);
  overflow: hidden;
}

.video-locked-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15, 23, 42, 0.88);
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 20;
  padding: 1.5rem;
  text-align: center;
  color: #ffffff;
}

.locked-card {
  max-width: 420px;
  background-color: var(--color-bg-card);
  color: var(--color-text-main);
  padding: 2rem;
  border-radius: var(--border-radius-lg);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
}

.locked-card h3 {
  font-family: var(--font-serif);
  color: var(--color-primary);
  margin-top: 0.5rem;
}

.locked-card p {
  font-size: var(--fs-base);
  color: var(--color-text-muted);
}




/* Finance Module Specific Styles */
.finance-sub-tabs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.finance-sub-tabs .btn {
  border-radius: 20px;
  padding: 0.4rem 1rem;
  font-size: var(--fs-base);
}

.finance-kpi-grid {
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

.finance-kpi-grid .admin-stat-card {
  padding: 1.25rem;
}

.finance-kpi-grid .stat-title {
  font-size: var(--fs-sm);
  color: var(--color-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: bold;
}

.finance-kpi-grid .stat-value {
  font-size: var(--fs-2xl);

/* ==========================================================================
   TOSB - GUIA TÉCNICO DE IDENTIDADE VISUAL DIGITAL v1.0 (DESIGN 2)
   Especificação completa para Design System, Cores, Tipografia e Componentes
   ========================================================================== */

.theme-tosb-v2 {
  /* Design Tokens de Cores Oficiais */
  --gradient-brand: linear-gradient(135deg, var(--tosb-green-800) 0%, var(--tosb-green-900) 100%);
  --gradient-placeholder: linear-gradient(135deg, var(--tosb-cream-300) 0%, var(--tosb-muted) 100%);
  --tosb-green-950: #07180F;
  --tosb-green-900: #0B2418;
  --tosb-green-800: #123523;
  --tosb-green-700: #214B33;

  --tosb-gold-700: #9A6A18;
  --tosb-gold-600: #B68A35;
  --tosb-gold-500: #D0A54E;
  --tosb-gold-300: #E8CC8D;

  --tosb-cream-50: #FFFDF8;
  --tosb-cream-100: #FAF2E6;
  --tosb-cream-200: #F3EADA;
  --tosb-cream-300: #DDD2BD;
  --tosb-ink: #121913;
  --tosb-muted: #625E54;
  --tosb-white: #FFFFFF;

  /* Tokens Semânticos */
  --color-bg-page: var(--tosb-cream-100);
  --color-bg-surface: var(--tosb-cream-50);
  --color-bg-brand: var(--tosb-green-950);
  --color-bg-brand-soft: var(--tosb-green-900);
  --color-text-primary: var(--tosb-ink);
  --color-text-secondary: var(--tosb-muted);
  --color-text-inverse: var(--tosb-cream-50);
  --color-accent: var(--tosb-gold-600);
  --color-accent-strong: var(--tosb-gold-700);
  --color-border: rgba(154, 106, 24, 0.30);
  --color-focus: var(--tosb-gold-500);

  /* Mapeamento para Legado */
  --color-primary: var(--tosb-green-900);
  --color-primary-light: var(--tosb-cream-200);
  --color-secondary: var(--tosb-green-950);
  --color-sidebar-bg: var(--tosb-green-900);
  --color-bg-base: var(--tosb-cream-100);
  --color-bg-card: var(--tosb-cream-50);
  --color-text-main: var(--tosb-ink);
  --color-text-muted: var(--tosb-muted);

  /* Tipografia Oficial */
  --font-display: "Oswald";
  --font-ui: "Montserrat";
  --font-serif: var(--font-display);
  --font-sans: var(--font-ui);

  /* Raios e Sombras */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --border-radius-sm: 8px;
  --border-radius-md: 14px;
  --border-radius-lg: 22px;

  --shadow-sm: 0 4px 12px rgba(7, 24, 15, 0.10);
  --shadow-md: 0 10px 28px rgba(7, 24, 15, 0.14);
  --shadow-lg: 0 16px 36px rgba(7, 24, 15, 0.20);
  --shadow-brand: 0 8px 20px rgba(7, 24, 15, 0.28);
  --shadow-gold: 0 0 0 1px rgba(182, 138, 53, .35), 0 8px 18px rgba(154, 106, 24, .16);

  /* Gradientes */
  --gradient-brand: linear-gradient(135deg, #07180F 0%, #0B2418 58%, #123523 100%);
  --gradient-gold-line: linear-gradient(90deg, transparent 0%, #B68A35 24%, #E8CC8D 50%, #B68A35 76%, transparent 100%);
  --gradient-cream: linear-gradient(180deg, #FFFDF8 0%, #FAF2E6 100%);

  background-color: var(--tosb-cream-100);
  color: var(--tosb-ink);
  font-family: var(--font-ui);
}


/* Cabeçalho Institucional - Design 2 TOSB */
.theme-tosb-v2 .tosb-header {
  background: var(--color-primary);
  border-bottom: 2px solid var(--tosb-gold-600);

}

.theme-tosb-v2 .tosb-header::after {

}

.theme-tosb-v2 .logo-title {

  font-size: var(--fs-2xl);
  font-weight: 700;

}

.theme-tosb-v2 .logo-subtitle {

.theme-tosb-v2 .nav-link,
.theme-tosb-v2 .nav-dropdown-content .dropdown-item,

.theme-tosb-v2 .tosb-header .btn-primary,

.theme-tosb-v2 .tosb-header .btn span,
.theme-tosb-v2 .tosb-header .layout-switcher-pill span {

}

.theme-tosb-v2 .tosb-header .btn:hover,
.theme-tosb-v2 .tosb-header .btn-acc:hover,
.theme-tosb-v2 .tosb-header .layout-switcher-pill:hover {

/* .btn-secondary transferido para o bloco unificado */

/* Cards e Superfícies Elevadas - TOSB v2 */
.theme-tosb-v2 .card,

/* Formulários e Inputs - TOSB v2 */
.theme-tosb-v2 .form-input,

/* ==========================================================================
   MOBILE SANDWICH NAV DECORATIONS AND RESPONSIVENESS
   ========================================================================== */

/* Base responsiveness for Desktop vs Mobile nav */
.mobile-only-nav {
  display: none !important;
}

.desktop-only-nav {
  display: flex !important;
}

@media (max-width: 768px) {
  .desktop-only-nav {
    display: none !important;
  }

  .mobile-only-nav {
    display: none !important;
  }

  .mobile-only-nav.mobile-open {
    display: flex !important;
    flex-direction: column !important;
    flex-wrap: nowrap !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    max-height: calc(100vh - 80px) !important;
    gap: 0.25rem !important;
    /* Request 6: Decreased spacing */
  }

  .mobile-only-nav .nav-link {
    padding: 0.4rem 0.75rem !important;
    /* Request 6: Decreased spacing */
    margin-bottom: 0.15rem !important;
    border-radius: var(--border-radius-sm) !important;
  }

  /* ================== Mobile Menu Colors (Match Desktop) ================== */

  /* Design 1 (Base Classic) */
  .mobile-only-nav {
    background-color: var(--color-primary) !important;
    border-bottom: 2px solid var(--color-secondary) !important;
  }

// Helper para gerar slugs legíveis de cursos
const getSlug = (title) => {
  return title
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
};

const checkIsDemo = () => {
  const pathname = window.location.pathname;
  return (
    pathname.endsWith('demo.html') ||
    window.location.protocol === 'file:' ||
    window.location.hostname === 'localhost' ||
    window.location.hostname === '127.0.0.1' ||
    !pathname.endsWith('.html')
  );
};

const getPageFromPathname = () => {
  const isDemo = checkIsDemo();
  if (isDemo) {
    const hash = window.location.hash || '#inicio';
    if (hash.startsWith('#curso/')) return 'course-detail';
    if (hash.startsWith('#livro/')) return 'book-detail';
    if (hash.startsWith('#aula/')) return 'course-view';
    const pageHash = hash.replace('#', '').split('?')[0];

    // Reverse lookup for hash
    const entries = Object.entries(PAGE_URLS);
    for (const [key, value] of entries) {
      if (value === pageHash) return key;
    }
    if (pageHash === 'inicio' || !pageHash) return 'home';
    return 'home';
  }

  const pathname = window.location.pathname;
  for (const [key, value] of Object.entries(PAGE_URLS)) {
    if (pathname.endsWith(`/${value}.html`) || pathname.endsWith(`/${value}`)) {
      return key;
    }
  }
  return 'home';
};

const RichTextEditor = ({ value, onChange, placeholder }) => {
  const editorRef = useRef(null);
  const [activeCell, setActiveCell] = useState(null);
  const [canInsertTable, setCanInsertTable] = useState(false);
  const [isSourceMode, setIsSourceMode] = useState(false);
  const [showColorPicker, setShowColorPicker] = useState(false);
  const [currentColor, setCurrentColor] = useState(FONT_COLORS[0]);
  const [htmlContent, setHtmlContent] = useState(value || '');
  const lastValueRef = useRef(value);

  useEffect(() => {
    if (value !== lastValueRef.current) {
      setHtmlContent(value || '');
      lastValueRef.current = value;
    }
  }, [value]);

  useEffect(() => {
    if (!isSourceMode && editorRef.current && editorRef.current.innerHTML !== htmlContent) {
      editorRef.current.innerHTML = htmlContent;
    }
  }, [htmlContent, isSourceMode]);

  const updateSelection = () => {
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    const node = selection.anchorNode;
    if (!node) return;

    if (editorRef.current?.contains(node)) {
      const tableNode = node.nodeType === 3 ? node.parentNode.closest('table') : node.closest?.('table');
      setCanInsertTable(!tableNode);

      const cell = node.nodeType === 3 ? node.parentNode.closest('td, th') : node.closest?.('td, th');
      if (cell && cell.closest('tbody')) {
        setActiveCell(cell);
      } else {
        setActiveCell(null);
      }
    }
  };

  const execCommand = (command, val = null) => {
    document.execCommand(command, false, val);
    if (editorRef.current) {
      editorRef.current.focus();
      const currentHtml = editorRef.current.innerHTML;
      setHtmlContent(currentHtml);
      onChange(currentHtml);
    }
  };

  const handleInput = () => {
    if (editorRef.current) {
      const currentHtml = editorRef.current.innerHTML;
      setHtmlContent(currentHtml);
      onChange(currentHtml);
    }
  };

  const handleBlur = () => {
    handleInput();
    setCanInsertTable(false);
    setActiveCell(null);
    setShowColorPicker(false);
  };

  const replaceTableWithUndo = (table, newTableClone) => {
    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNode(table);
    selection.removeAllRanges();
    selection.addRange(range);
    document.execCommand('insertHTML', false, newTableClone.outerHTML);
    handleInput();
  };

  const addRow = () => {
    if (!activeCell) return;
    const tr = activeCell.closest('tr');
    const table = activeCell.closest('table');
    if (!tr || !table) return;

    const tableClone = table.cloneNode(true);
    const trIndex = Array.from(table.rows).indexOf(tr);
    const cloneTr = tableClone.rows[trIndex];

    const newTr = document.createElement('tr');
    newTr.className = 'syllabus-lesson-item';
    const tds = cloneTr.querySelectorAll('td, th');
    tds.forEach(cell => {
      const newCell = document.createElement(cell.tagName);
      newCell.innerHTML = 'Texto';
      newTr.appendChild(newCell);
    });
    cloneTr.parentNode.insertBefore(newTr, cloneTr.nextSibling);

    replaceTableWithUndo(table, tableClone);
  };

  const addColumn = () => {
    if (!activeCell) return;
    const tr = activeCell.closest('tr');
    const table = activeCell.closest('table');
    if (!tr || !table) return;

    const tableClone = table.cloneNode(true);
    const cells = Array.from(tr.children);
    const cellIndex = cells.indexOf(activeCell);

    const rows = tableClone.querySelectorAll('tr');
    rows.forEach(row => {
      const rowCells = Array.from(row.children);
      const targetCell = rowCells[cellIndex] || rowCells[rowCells.length - 1];
      if (targetCell) {
        const newCell = document.createElement(targetCell.tagName);
        newCell.innerHTML = targetCell.tagName === 'TH' ? 'Título' : 'Texto';
        row.insertBefore(newCell, targetCell.nextSibling);
      }
    });

    replaceTableWithUndo(table, tableClone);
  };

  const insertTable = () => {
    const tableId = 'temp_table_' + Date.now();
    const tableHTML = `
      <table id="${tableId}" class="syllabus-module-card" style="width: 100%; margin-bottom: 1rem;">
        <thead>
          <tr><th colspan="1">Título</th></tr>
        </thead>
        <tbody class="syllabus-lessons-list">
          <tr class="syllabus-lesson-item"><td>Texto</td></tr>
        </tbody>
      </table><p><br></p>
    `;
    document.execCommand('insertHTML', false, tableHTML);
    const table = document.getElementById(tableId);
    if (table) {
      table.removeAttribute('id');
      const th = table.querySelector('th');
      if (th) {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(th);
        selection.removeAllRanges();
        selection.addRange(range);
      }
    }
    handleInput();
  };

  return (
    <div className="rich-text-editor-container" style={{ display: 'flex', flexDirection: 'column' }}>
      <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap', padding: '0.5rem', backgroundColor: '#f8fafc', border: '1px solid var(--color-border)', borderRadius: 'var(--border-radius-sm) var(--border-radius-sm) 0 0', borderBottom: 'none' }}>
        <button type="button" className="btn btn-secondary" style={{ padding: '0.25rem 0.5rem', fontSize: '0.875rem' }} onMouseDown={(e) => e.preventDefault()} onClick={() => setIsSourceMode(!isSourceMode)}>
          {isSourceMode ? '👁️ Visualizar' : '</> HTML'}
        </button>
        {!isSourceMode && (
          <>
            <button type="button" className="btn btn-secondary" style={{ padding: '0.25rem 0.5rem', fontSize: '0.875rem' }} onMouseDown={(e) => e.preventDefault()} onClick={() => execCommand('bold')}><b>B</b></button>
            <button type="button" className="btn btn-secondary" style={{ padding: '0.25rem 0.5rem', fontSize: '0.875rem', fontStyle: 'italic' }} onMouseDown={(e) => e.preventDefault()} onClick={() => execCommand('italic')}>I</button>
            <button type="button" className="btn btn-secondary" style={{ padding: '0.25rem 0.5rem', fontSize: '0.875rem' }} onMouseDown={(e) => e.preventDefault()} onClick={() => {
              const url = prompt('Inserir URL:');
              if (url) execCommand('createLink', url);
            }}>🔗 Link</button>
            <div style={{ position: 'relative', display: 'flex', alignItems: 'center', marginLeft: '0.5rem', marginRight: '0.5rem', borderLeft: '1px solid var(--color-border)', paddingLeft: '0.5rem', borderRight: '1px solid var(--color-border)', paddingRight: '0.5rem' }}>
              <button
                type="button"
                title="Cor da Fonte"
                onMouseDown={(e) => e.preventDefault()}
                onClick={() => setShowColorPicker(!showColorPicker)}
                style={{ width: '1.25rem', height: '1.25rem', borderRadius: '50%', backgroundColor: currentColor.val, border: '1px solid var(--color-border)', cursor: 'pointer', padding: 0, display: 'block' }}
              />
              {showColorPicker && (
                <div style={{ position: 'absolute', top: '100%', left: '0.5rem', marginTop: '0.5rem', padding: '0.5rem', backgroundColor: '#fff', border: '1px solid var(--color-border)', borderRadius: 'var(--border-radius-sm)', display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '0.35rem', zIndex: 10, boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)' }}>
                  {FONT_COLORS.map(c => (
                    <button
                      key={c.id}
                      type="button"
                      title={c.val}
                      onMouseDown={(e) => e.preventDefault()}
                      onClick={() => {
                        execCommand('foreColor', c.val);
                        setCurrentColor(c);
                        setShowColorPicker(false);
                      }}
                      style={{ width: '1.25rem', height: '1.25rem', borderRadius: '50%', backgroundColor: c.val, border: '1px solid var(--color-border)', cursor: 'pointer', padding: 0 }}
                    />
                  ))}
                </div>
              )}
            </div>
            <button type="button" className="btn btn-secondary" style={{ padding: '0.25rem 0.5rem', fontSize: '0.875rem', backgroundColor: '#e2e8f0', color: '#0f172a', display: activeCell ? 'inline-block' : 'none' }} onMouseDown={(e) => e.preventDefault()} onClick={addRow}>+ Linha</button>
            <button type="button" className="btn btn-secondary" style={{ padding: '0.25rem 0.5rem', fontSize: '0.875rem', backgroundColor: '#e2e8f0', color: '#0f172a', display: activeCell ? 'inline-block' : 'none' }} onMouseDown={(e) => e.preventDefault()} onClick={addColumn}>+ Coluna</button>
            <button type="button" className="btn btn-secondary" style={{ padding: '0.25rem 0.75rem', fontSize: '0.875rem', display: canInsertTable ? 'inline-block' : 'none' }} onMouseDown={(e) => e.preventDefault()} onClick={insertTable}>+ Tabela</button>
          </>
        )}
      </div>
      {isSourceMode ? (
        <textarea
          className="rich-text-editor rich-text-content"
          value={htmlContent}
          onChange={(e) => {
            setHtmlContent(e.target.value);
            onChange(e.target.value);
          }}
          style={{ borderTopLeftRadius: 0, borderTopRightRadius: 0, width: '100%', resize: 'vertical', fontFamily: 'monospace' }}
          placeholder={placeholder}
        />
      ) : (
        <div
          ref={editorRef}
          className="rich-text-editor rich-text-content"
          contentEditable
          onInput={handleInput}
          onBlur={handleBlur}
          onMouseUp={updateSelection}
          onKeyUp={updateSelection}
          style={{ borderTopLeftRadius: 0, borderTopRightRadius: 0 }}
          placeholder={placeholder}
        ></div>
      )}
    </div>
  );
};

    let lastScrollY = window.scrollY;

    const handleScroll = () => {
      const currentScrollY = window.scrollY;
      const diff = currentScrollY - lastScrollY;

      const headerEl = document.querySelector('.tosb-header');
      const maxOffset = headerEl ? headerEl.offsetHeight : 100;

      setHeaderOffset(prev => {
        if (currentScrollY <= 0) return 0;
        let newOffset = prev - diff;
        if (newOffset > 0) newOffset = 0;
        if (newOffset < -maxOffset) newOffset = -maxOffset;
        return newOffset;
      });
      lastScrollY = currentScrollY;
    };

    window.addEventListener('scroll', handleScroll, { passive: true });
    return () => window.removeEventListener('scroll', handleScroll);

    (mockDb.enrollments || []).forEach(e => {
      if (e.status === 'ACTIVE') {
        const expiresAt = new Date(e.expires_at);
        const diffMs = expiresAt - now;
        const diffDays = diffMs / (1000 * 60 * 60 * 24);
        if (diffDays > 0 && diffDays <= 3) {
          const student = mockDb.users.find(u => u.id === e.student_id);
          const course = mockDb.courses.find(c => c.id === e.course_id);
          if (student && course) {
            sendExpirationReminderEmail(student, course.title, e.expires_at);
            sentCount++;
          }
        }

    });

          full_description,
          type,
          duration_days,
          workload_hours,
          min_attendance_pct,
          banner_url,
          finishing_message,
          teacher_id,
          teacher_ids,
          active: true
        };
        updatedCourses = [...prev.courses, newCourse];
      }

      // Atualizar Valores dos Professores para este curso e registrar no Histórico
      let updatedTeacherCourses = [...(prev.teacher_courses || [])];
      let updatedHistory = [...(prev.teacher_payment_history || [])];

      const teachers = prev.users.filter(u => u.role === 'TEACHER');
      teachers.forEach(t => {
        const typeInput = e.target[`payment_type_${t.id}`];
        const rateInput = e.target[`payment_rate_${t.id}`];
        const unitInput = e.target[`payment_unit_${t.id}`];

        if (typeInput && rateInput) {
          const newType = typeInput.value;
          const newRate = parseFloat(rateInput.value) || 0;
          const newUnit = unitInput ? unitInput.value : 'BRL';

          // Verificar configuração atual
          const existingConfigIndex = updatedTeacherCourses.findIndex(tc => tc.teacher_id === t.id && tc.course_id === targetCourseId);
          const currentConfig = existingConfigIndex > -1 ? updatedTeacherCourses[existingConfigIndex] : null;

          // Se mudou ou é novo, adiciona ao histórico permanentemente para consulta
          if (!currentConfig || currentConfig.payment_type !== newType || currentConfig.payment_rate !== newRate || currentConfig.payment_unit !== newUnit) {
            const historyEntry = {
              id: 'tph-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
              course_id: targetCourseId,
              teacher_id: t.id,
              teacher_name: t.name,
              payment_type: newType,
              payment_rate: newRate,
              created_at: new Date().toISOString(),
              notes: id ? 'Atualização de valor na Gestão de Cursos' : 'Valores definidos na criação do curso'
            };
            updatedHistory.unshift(historyEntry);
          }

          const newTcObj = {
            id: currentConfig ? currentConfig.id : `tc_${t.id}_${targetCourseId}`,
            teacher_id: t.id,
            course_id: targetCourseId,
            payment_type: newType,
            payment_rate: newRate,
            updated_at: new Date().toISOString()
          };

          if (existingConfigIndex > -1) {
            updatedTeacherCourses[existingConfigIndex] = newTcObj;
          } else {
            updatedTeacherCourses.push(newTcObj);
          }
        }
      });

      return {
        ...prev,
        courses: updatedCourses,
        teacher_courses: updatedTeacherCourses,
        teacher_payment_history: updatedHistory
      };
    });

  // ADMIN: CONCILIAÇÃO OFX
  const handleConciliation = async (e) => {
    e.preventDefault();
    clearAlerts();

    if (isOfflineMode) {
      // Simulação de Parser de OFX no frontend!
      // Extrair tags <STMTTRN>
      const trnRegex = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
      const parsedTx = [];
      let m;
      while ((m = trnRegex.exec(ofxInput)) !== null) {
        const block = m[1];
        const amtMatch = block.match(/<TRNAMT>([^<\r\n]+)/i);
        const refMatch = block.match(/<REFNUM>([^<\r\n]+)/i);
        const memoMatch = block.match(/<MEMO>([^<\r\n]+)/i);

        const amt = amtMatch ? parseFloat(amtMatch[1].trim()) : 0;
        const ref = refMatch ? refMatch[1].trim() : '';
        const memo = memoMatch ? memoMatch[1].trim() : '';

        parsedTx.push({ amount: amt, ref, memo });
      }

      const results = { reconciled: [], divergent: [], unmatched: [], processedCount: parsedTx.length };

      setMockDb(prev => {
        const currentPayments = [...prev.payments];
        const currentEnrollments = [...prev.enrollments];

        parsedTx.forEach(tx => {
          const rawCode = tx.memo || tx.ref || '';
          const codeMatch = rawCode.match(/ASAAS_[A-Z0-9_]+/i);
          const code = codeMatch ? codeMatch[0].toUpperCase() : null;

          if (!code) {
            results.unmatched.push({ description: 'Transação bancária sem código Asaas', amount: tx.amount });
            return;
          }

          const payIdx = currentPayments.findIndex(p => p.transaction_code === code);
          if (payIdx === -1) {
            results.unmatched.push({ description: `Código ${code} não encontrado no LMS`, amount: tx.amount });
            return;
          }

          const p = currentPayments[payIdx];
          const bankAmt = Math.abs(tx.amount);
          const localAmt = parseFloat(p.amount);

          if (bankAmt !== localAmt) {
            results.divergent.push({ transactionCode: code, bankAmount: bankAmt, localAmount: localAmt });
            return;
          }

          // Conciliar
          if (p.status === 'PENDING') {
            currentPayments[payIdx] = { ...p, status: 'RECEIVED', paid_at: new Date().toISOString() };

            // Ativar matrícula
            const c = prev.courses.find(course => course.id === p.course_id);
            const duration = c ? c.duration_days : 180;
            const enIdx = currentEnrollments.findIndex(e => e.student_id === p.student_id && e.course_id === p.course_id);

            if (enIdx !== -1) {
              currentEnrollments[enIdx] = { ...currentEnrollments[enIdx], status: 'ACTIVE', expires_at: new Date(Date.now() + duration * 24 * 60 * 60 * 1000).toISOString() };
            } else {
              currentEnrollments.push({
                id: 'enroll_' + Date.now(),
                student_id: p.student_id,
                course_id: p.course_id,
                enrolled_at: new Date().toISOString(),
                expires_at: new Date(Date.now() + duration * 24 * 60 * 60 * 1000).toISOString(),
                status: 'ACTIVE'
              });
            }

            results.reconciled.push({ transactionCode: code, amount: bankAmt, statusChanged: true });
          } else {
            results.reconciled.push({ transactionCode: code, amount: bankAmt, statusChanged: false, message: 'Já estava confirmado' });
          }
        });

        return {
          ...prev,
          payments: currentPayments,
          enrollments: currentEnrollments
        };
      });

      setConciliationResults(results);
      setSuccess('Conciliação financeira simulada processada com sucesso!');
      loadAdminReport();
    } else {
      try {
        const res = await fetch('/api/conciliations/upload', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`

        setError('Erro ao processar conciliação.');
      }
    }
  };
