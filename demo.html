  <style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

:root {
  /* Tokens Oficiais TOSB - Paleta Exclusiva da Tabela */
  --tosb-green-950: #07180F;
  --tosb-green-900: #0B2418;
  --tosb-green-800: #123523;
  --tosb-green-700: #214B33;

  --tosb-gold-700: #9A6A18;
  --tosb-gold-600: #B68A35;
  --tosb-gold-500: #D0A54E;
  --tosb-gold-300: #E8CC8D;

  --tosb-cream-50: #FFFDF8;
  --tosb-cream-100: #FAF2E6;
  --tosb-cream-200: #F3EADA;
  --tosb-cream-300: #DDD2BD;
  --tosb-ink: #121913;
  --tosb-muted: #625E54;
  --tosb-white: #FFFFFF;

  /* Mapeamento de Variáveis Globais (Usando Apenas Cores da Tabela) */
  --color-primary: var(--tosb-green-900);
  /* #0B2418 */
  --color-primary-light: var(--tosb-cream-200);
  /* #F3EADA */
  --color-secondary: var(--tosb-green-950);
  /* #07180F */
  --color-accent: var(--tosb-gold-600);
  /* #B68A35 */
  --color-bg-base: var(--tosb-cream-100);
  /* #FAF2E6 */
  --color-bg-card: var(--tosb-cream-50);
  /* #FFFDF8 */
  --color-text-main: var(--tosb-ink);
  /* #121913 */
  --color-text-muted: var(--tosb-muted);
  /* #625E54 */
  --color-border: var(--tosb-cream-300);
  /* #DDD2BD */

  /* Mensagens de Sucesso, Erro e Aviso (Exceções autorizadas pelo usuário) */
  --color-success: #166534;
  --color-error: #9f1239;
  --color-warning: #9a3412;

  /* Acessibilidade */
  --font-multiplier: 1;

  /* Tipografia */
  --font-serif: 'Oswald', Georgia, serif;
  --font-sans: 'Montserrat', Arial, sans-serif;

  /* Efeitos */
  --shadow-sm: 0 2px 8px rgba(7, 24, 15, 0.06);
  --shadow-md: 0 6px 18px rgba(7, 24, 15, 0.10);
  --shadow-lg: 0 12px 28px rgba(7, 24, 15, 0.16);
  --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --border-radius-sm: 8px;
  --border-radius-md: 14px;
  --border-radius-lg: 22px;
}

/* Reset básico */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: calc(16px * var(--font-multiplier, 1)) !important;
}

body {
  font-family: var(--font-sans);
  background-color: var(--color-bg-base);
  color: var(--color-text-main);
  font-size: 1.05rem;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
h4 {
  font-family: var(--font-serif);
  color: var(--color-secondary);
  font-weight: 600;
}

/* Layout Geral */
.app-container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Cabeçalho TOSB Premium */
.tosb-header {
  background-color: var(--color-bg-card);
  border-bottom: 1px solid var(--color-border);
  padding: 1.25rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.logo-container {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
}

.logo-symbol {
  font-size: 1.75rem;
}

.logo-text {
  display: flex;
  flex-direction: column;
}

.logo-title {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  font-weight: bold;
  color: var(--color-primary);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.logo-subtitle {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: var(--color-text-muted);
  text-transform: uppercase;
}

/* Navegação */
.nav-links {
  display: flex;
  gap: 1.5rem;
  align-items: center;
}

.nav-link {
  text-decoration: none;
  color: var(--color-text-main);
  font-weight: 500;
  font-size: 0.95rem;
  transition: var(--transition-smooth);
  padding: 0.5rem 0.75rem;
  border-radius: var(--border-radius-sm);
}

.nav-link:hover,
.nav-link.active {
  color: var(--color-primary);
  background-color: var(--color-primary-light);
}

/* Botões */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.6rem 1.25rem;
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: var(--border-radius-md);
  border: none;
  cursor: pointer;
  transition: var(--transition-smooth);
  text-decoration: none;
  gap: 0.5rem;
}

.btn-primary {
  background-color: var(--color-primary);
  color: white;
}

.btn-primary:hover {
  background-color: #043a2c;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(6, 78, 59, 0.2);
}

.btn-secondary {
  background-color: transparent;
  border: 1px solid var(--color-border);
  color: var(--color-text-main);
}

.btn-secondary:hover {
  background-color: var(--color-primary-light);
  color: var(--color-primary);
  border-color: var(--color-primary);
}

.btn-danger {
  background-color: var(--color-error);
  color: white;
}

.btn-danger:hover {
  background-color: #9d0c32;
}

/* Cards Premium */
.card {
  background-color: var(--color-bg-card);
  border-radius: var(--border-radius-lg);
  border: 1px solid var(--color-border);
  padding: 1.75rem;
  box-shadow: var(--shadow-md);
  transition: var(--transition-smooth);
}

.card-hover:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--color-primary-light);
}

/* Grid layout */
.grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1.5rem;
}

/* Containers e Áreas principais */
.main-content {
  flex: 1;
  padding: 2.5rem 2rem;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

/* Rodapé Sophisticated */
.tosb-footer {
  background-color: var(--color-secondary);
  color: #94a3b8;
  padding: 3rem 2rem 1.5rem;
  margin-top: auto;
  border-top: 4px solid var(--color-primary);
}

.footer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 2.5rem;
  max-width: 1200px;
  margin: 0 auto;
  padding-bottom: 2rem;
  border-bottom: 1px solid #334155;
}

.footer-section h4 {
  color: white;
  margin-bottom: 1.25rem;
  font-size: 1.1rem;
}

.footer-links {
  list-style: none;
}

.footer-link {
  color: #94a3b8;
  text-decoration: none;
  font-size: 0.9rem;
  display: block;
  margin-bottom: 0.6rem;
  transition: var(--transition-smooth);
}

.footer-link:hover {
  color: var(--color-accent);
  padding-left: 4px;
}

.footer-bottom {
  max-width: 1200px;
  margin: 0 auto;
  padding-top: 1.5rem;
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  flex-wrap: wrap;
  gap: 1rem;
}

/* Alertas estilo GitHub */
.alert {
  padding: 1rem 1.25rem;
  border-radius: var(--border-radius-md);
  margin-bottom: 1.5rem;
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  font-size: 0.92rem;
}

.alert-danger {
  background-color: #fff1f2;
  border: 1px solid #fecdd3;
  color: var(--color-error);
}

.alert-success {
  background-color: #f0fdf4;
  border: 1px solid #bbf7d0;
  color: var(--color-success);
}

.alert-warning {
  background-color: #fffbeb;
  border: 1px solid #fde68a;
  color: var(--color-warning);
}

/* Modais / Telas de Login */
.auth-box {
  max-width: 480px;
  width: 100%;
  margin: 3rem auto;
}

.auth-box-wide {
  max-width: 800px !important;
}

.form-group {
  margin-bottom: 1.25rem;
}

.form-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-main);
  margin-bottom: 0.4rem;
}

.form-input {
  width: 100%;
  padding: 0.7rem 0.9rem;
  border-radius: var(--border-radius-md);
  border: 1px solid var(--color-border);
  font-family: var(--font-sans);
  font-size: 0.95rem;
  transition: var(--transition-smooth);
  background-color: #fafafa;
}

.form-input:focus {
  outline: none;
  border-color: var(--color-primary);
  background-color: white;
  box-shadow: 0 0 0 3px rgba(6, 78, 59, 0.1);
}

.terms-container {
  max-height: 150px;
  overflow-y: scroll;
  border: 1px solid var(--color-border);
  padding: 0.75rem;
  border-radius: var(--border-radius-sm);
  background-color: #f8fafc;
  font-size: 0.8rem;
  margin-bottom: 0.75rem;
}

/* Estilos de Player e Quiz */
.player-container {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  /* 16:9 Aspect Ratio */
  background-color: #000;
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  margin-bottom: 1.5rem;
}

.player-video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.quiz-container {
  background-color: var(--color-bg-card);
  padding: 2rem;
  border-radius: var(--border-radius-lg);
  border: 1px solid var(--color-border);
  margin-top: 2rem;
}

.quiz-question-card {
  margin-bottom: 1.75rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px dashed var(--color-border);
}

.quiz-question-text {
  font-size: 1.05rem;
  margin-bottom: 1rem;
  color: var(--color-secondary);
}

.quiz-option-label {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-md);
  margin-bottom: 0.5rem;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.quiz-option-label:hover {
  background-color: var(--color-primary-light);
  border-color: var(--color-primary);
}

.quiz-option-label.selected {
  background-color: var(--color-primary-light);
  border-color: var(--color-primary);
  font-weight: 600;
}

/* Responsividade simples */
@media (max-width: 768px) {
  .tosb-header {
    flex-direction: column;
    gap: 1rem;
    padding: 1rem;
  }

  .nav-links {
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .main-content {
    padding: 1.5rem 1rem;
  }
}

/* --- Classes utilitárias e semânticas refatoradas de App.jsx --- */

/* Badge de Modo de Simulação */
.offline-mode-badge {
  background-color: #fffbeb;
  border: 1px solid #fde68a;
  color: #b45309;
  padding: 0.25rem 0.75rem;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: bold;
}

/* Identificadores e Textos Auxiliares */
.user-greeting {
  font-size: 0.9rem;
  color: var(--color-text-muted);
}

.main-content-top {
  padding-bottom: 0;
}

.text-center {
  text-align: center;
}

.w-full {
  width: 100%;
}

.flex-1 {
  flex: 1;
}

.flex-2 {
  flex: 2;
}

.cursor-pointer {
  cursor: pointer;
}

.pointer-events-none {
  pointer-events: none;
}

/* Margens utilitárias */
.mb-1 {
  margin-bottom: 0.25rem;
}

.mb-2 {
  margin-bottom: 0.5rem;
}

.mb-3 {
  margin-bottom: 0.75rem;
}

.mb-4 {
  margin-bottom: 1rem;
}

.mb-5 {
  margin-bottom: 1.5rem;
}

.mb-6 {
  margin-bottom: 2rem;
}

.mb-7 {
  margin-bottom: 2.5rem;
}

.mt-1 {
  margin-top: 0.25rem;
}

.mt-2 {
  margin-top: 0.5rem;
}

.mt-3 {
  margin-top: 0.75rem;
}

.mt-4 {
  margin-top: 1rem;
}

.mt-5 {
  margin-top: 1.5rem;
}

.mt-6 {
  margin-top: 2rem;
}

/* Grid e Flex Layouts Gerais */
.flex-center-gap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.grid-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.grid-2col-wide {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

.dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.dashboard-layout {
  display: grid;
  grid-template-columns: 3fr 1fr;
  gap: 2rem;
}

.section-title-underlined {
  margin-bottom: 1rem;
  border-bottom: 2px solid var(--color-primary-light);
  padding-bottom: 0.5rem;
}

.section-title-underlined-thin {
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--color-border);
  padding-bottom: 0.5rem;
}

/* Assistente de Login Rápido */
.quick-login-container {
  background-color: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 0.75rem;
  margin-bottom: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.quick-login-title {
  font-size: 0.75rem;
  font-weight: bold;
  color: var(--color-primary);
  text-transform: uppercase;
}

.quick-login-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.btn-quick-login {
  padding: 0.25rem 0.5rem;
  font-size: 0.75rem;
}

.helper-text {
  font-size: 0.7rem;
  color: #64748b;
}

/* Trava de IP no Login */
.ip-warning-container {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background-color: #fff1f2;
  padding: 0.5rem;
  border-radius: 6px;
  border: 1px solid #fecdd3;
}

.ip-warning-label {
  font-size: 0.8rem;
  color: var(--color-error);
  cursor: pointer;
}

/* Card de Largura Larga (Cadastro) */
.auth-box-wide {
  max-width: 600px;
}

/* Grade de Cursos */
.courses-list {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.course-card-grid {
  display: grid;
  grid-template-columns: 3fr 1fr;
  gap: 1.5rem;
  align-items: center;
}

.course-type-badge {
  font-size: 0.75rem;
  font-weight: bold;
  color: var(--color-accent);
  text-transform: uppercase;
  display: block;
  margin-bottom: 0.25rem;
}

.course-card-title {
  font-size: 1.25rem;
  margin-bottom: 0.5rem;
}

.course-card-description {
  color: var(--color-text-muted);
  font-size: 0.9rem;
  margin-bottom: 0.5rem;
}

.course-card-expires {
  font-size: 0.8rem;
  color: #64748b;
}

.course-card-actions {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  text-align: right;
}

.error-text-bold {
  color: var(--color-error);
  font-weight: bold;
  font-size: 0.85rem;
}

.muted-text-bold {
  color: var(--color-text-muted);
  font-weight: bold;
  font-size: 0.85rem;
}

/* Financeiro / Invoices */
.invoices-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.invoice-card {
  border: 1px solid var(--color-border);
  border-radius: 8px;
  padding: 0.75rem;
  background-color: #fff;
  font-size: 0.85rem;
}

.invoice-title {
  font-weight: bold;
  margin-bottom: 0.25rem;
}

.invoice-details {
  color: var(--color-text-muted);
  margin-bottom: 0.5rem;
}

.invoice-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.badge-paid {
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: bold;
  background-color: #dcfce7;
  color: #166534;
}

.badge-pending {
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: bold;
  background-color: #e2e8f0;
  color: #475569;
}

.badge-overdue {
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: bold;
  background-color: #fee2e2;
  color: #991b1b;
}

.invoice-ref {
  display: block;
  margin-top: 0.5rem;
  color: #64748b;
}

.invoice-due {
  display: block;
  color: #64748b;
}

/* Checkout */
.checkout-item-title {
  font-size: 1.25rem;
  font-weight: bold;
  color: var(--color-primary);
  margin-top: 0.5rem;
}

.checkout-actions {
  display: flex;
  gap: 1rem;
  margin-top: 1.5rem;
}

/* LMS Layout & Player */
.lms-layout {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 2rem;
}

.lesson-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
}

.lesson-progress-meta {
  display: flex;
  gap: 1rem;
  align-items: center;
}

.lesson-progress-badge-completed {
  padding: 0.2rem 0.5rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: bold;
  background-color: #dcfce7;
  color: #166534;
}

.lesson-progress-badge-pending {
  padding: 0.2rem 0.5rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: bold;
  background-color: #f1f5f9;
  color: #64748b;
}

.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.quiz-attempts-list {
  font-size: 0.85rem;
  margin-top: 0.5rem;
  padding-left: 1.25rem;
}

.quiz-attempt-passed {
  color: var(--color-success);
}

.quiz-attempt-failed {
  color: var(--color-error);
}

.placeholder-box {
  border: 2px dashed var(--color-border);
  border-radius: 12px;
  padding: 3rem;
  text-align: center;
  color: var(--color-text-muted);
}

.course-conclusion-card {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-top: 2rem;
  border-left: 8px solid var(--color-success);
}

.lms-sidebar {
  border-left: 1px solid var(--color-border);
  padding-left: 1.5rem;
}

.sidebar-title {
  font-size: 1.1rem;
  margin-bottom: 1rem;
}

.modules-list-container {
  margin-bottom: 1.5rem;
}

.module-header-title {
  font-weight: bold;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-primary);
  margin-bottom: 0.5rem;
}

.lessons-list-container {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.lesson-item-sidebar {
  padding: 0.6rem 0.75rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  border: 1px solid transparent;
  background-color: #fff;
  color: var(--color-text-main);
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
  transition: var(--transition-smooth);
}

.flex-col {

/* ==========================================================================
   ACESSIBILIDADE E ALTO CONTRASTE (PÚBLICO IDOSO)
   ========================================================================== */

/* Seletor de Acessibilidade no Cabeçalho */
.accessibility-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background-color: var(--color-primary-light);
  padding: 0.35rem 0.75rem;
  border-radius: 20px;
  border: 1px solid var(--color-border);
}

.accessibility-popover-wrapper {
  position: relative;
  display: inline-block;
}

.accessibility-popover {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background-color: white;
  padding: 0.5rem 0.75rem;
  border-radius: 24px;
  border: 1px solid var(--color-border);
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  z-index: 1000;
  white-space: nowrap;
}

.accessibility-popover::after {
  content: '';
  position: absolute;
  bottom: 100%;
  right: 10px;
  border-width: 6px;
  border-style: solid;
  border-color: transparent transparent white transparent;
}

.btn-acc {
  background: white;
  border: 1px solid var(--color-border);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  transition: var(--transition-smooth);
  color: var(--color-primary);
}

.btn-acc:hover {
  background-color: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

.btn-contrast {
  border-radius: 12px;
  padding: 0 0.75rem;
  width: auto;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Sobrescritas de Alto Contraste */
body.high-contrast {
  --color-primary: #ffffff;
  --color-primary-light: #2d3748;
  --color-secondary: #ffff00;
  /* Amarelo sobre preto */
  --color-accent: #ffff00;
  --color-bg-base: #000000;
  --color-bg-card: #121212;
  --color-text-main: #ffffff;
  --color-text-muted: #e2e8f0;
  --color-border: #ffffff;
  --color-success: #00ff00;
  --color-error: #ff3333;
  --color-warning: #ffff00;
}

body.high-contrast * {
  border-color: #ffffff !important;
}

body.high-contrast .btn-primary {
  background-color: #ffff00 !important;
  color: #000000 !important;
  font-weight: 900 !important;
  border: 2px solid #ffffff !important;
}

body.high-contrast .btn-secondary {
  background-color: #000000 !important;
  color: #ffffff !important;
  border: 2px solid #ffffff !important;
}

body.high-contrast .lesson-item-sidebar.active {
  background-color: #ffff00 !important;
  color: #000000 !important;
}

body.high-contrast .nav-link:hover,
body.high-contrast .nav-link.active {
  background-color: #2d3748 !important;
  color: #ffff00 !important;
}

/* ==========================================================================
   PAINEL DO ALUNO: MENU LATERAL (SIDEBAR LAYOUT)
   ========================================================================== */
.student-panel-container {
  display: flex;
  gap: 2rem;
  align-items: flex-start;
  margin-top: 1rem;
}

.student-sidebar {
  width: 260px;
  background-color: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-lg);
  padding: 1rem;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.student-sidebar-menu {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  list-style: none;
}

.student-sidebar-item button {
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  padding: 0.8rem 1rem;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--color-text-main);
  border-radius: var(--border-radius-md);
  cursor: pointer;
  transition: var(--transition-smooth);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.student-sidebar-item button:hover {
  background-color: var(--color-primary-light);
  color: var(--color-primary);
}

.student-sidebar-item.active button {
  background-color: var(--color-primary);
  color: white;
}

.student-panel-content {
  flex: 1;
  min-width: 0;
}

.addresses-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}

@media (max-width: 900px) {
  .student-panel-container {
    flex-direction: column;
  }

  .student-sidebar {
    width: 100%;
  }

  .student-sidebar-menu {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
  }

  .student-sidebar-item button {
    padding: 0.6rem 0.8rem;
    font-size: 0.85rem;
  }

  .addresses-grid {
    grid-template-columns: 1fr;
  }
}

   ========================================================================== */

/* Hero Section */
.hero-section {

  border-radius: var(--border-radius-lg);
  padding: 3rem 2rem;
  margin-bottom: 2rem;
  border-bottom: 4px solid var(--color-accent);
}

.course-detail-hero h1 {
  color: white;
  font-family: var(--font-serif);
  font-size: 2.25rem;
  margin-bottom: 0.5rem;
}

.course-detail-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 2rem;
  align-items: flex-start;
}

.syllabus-module-card {
  border: 1px solid var(--color-border);
  border-radius: var(--border-radius-md);
  margin-bottom: 1rem;
  background: white;
  overflow: hidden;
}

.syllabus-module-header {
  background-color: var(--color-primary-light);
  padding: 1rem;
  font-weight: bold;
  color: var(--color-primary);
  border-bottom: 1px solid var(--color-border);
}

.syllabus-lessons-list {
  list-style: none;
  padding: 1rem;
}

.syllabus-lesson-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 0;
  border-bottom: 1px dashed var(--color-border);
  font-size: 0.95rem;
}

.syllabus-lesson-item:last-child {
  border-bottom: none;
}

.course-specs-table {
  width: 100%;
  border-collapse: collapse;
}

.course-specs-table td {
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--color-border);
  font-size: 0.95rem;
}

.course-specs-table td:first-child {
  font-weight: bold;
  color: var(--color-primary);
}

.course-specs-table tr:last-child td {
  border-bottom: none;
}

.teacher-bio-card {
  display: flex;
  gap: 1rem;
  align-items: flex-start;
  margin-top: 1.5rem;
  background-color: var(--color-primary-light);
  padding: 1rem;
  border-radius: var(--border-radius-md);
}

.teacher-bio-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background-color: var(--color-accent);
  color: var(--color-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: bold;
  flex-shrink: 0;
}

/* ==========================================================================
   MEDIA QUERIES PARA DISPOSITIVOS MÓVEIS (CELULARES)
   ========================================================================== */

@media (max-width: 768px) {

  /* Header e Menu hamburger */
  .hamburger-btn {
    display: inline-flex;
  }

  .tosb-header {
    position: relative;
    padding: 1rem 1.5rem;
    flex-wrap: wrap;
  }

  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    background-color: var(--color-bg-card);
    position: absolute;
    top: 100%;
    left: 0;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--color-border);
    box-shadow: var(--shadow-lg);
    z-index: 150;
    gap: 0.5rem;
    align-items: stretch;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
  }

  .nav-links.mobile-open {
    display: flex;
  }

  .nav-link {
    width: 100%;
    text-align: left;
    padding: 0.75rem 1rem;
    background-color: #f8fafc;
    border: 1px solid #f1f5f9;
  }

  .nav-dropdown {
    width: 100%;
  }

  .nav-dropdown-content {
    position: static;
    display: none;
    width: 100%;
    box-shadow: none;
    border: 1px solid var(--color-primary-light);
    border-radius: var(--border-radius-md);
    margin-top: 0.25rem;
    padding: 0.25rem;
  }

  .nav-dropdown-content.open {
    display: block;
  }

  .dropdown-item {
    padding: 0.75rem 1.25rem;
  }

  /* Ajustes de layouts de grid para 1 coluna */
  .grid-container,
  .premium-card-grid,
  .testimonial-grid,
  .directory-grid,
  .gallery-grid-photos {
    grid-template-columns: 1fr !important;
  }

  .grid-2col,
  .grid-2col-wide {
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  .course-detail-grid {
    grid-template-columns: 1fr;
  }

  /* LMS Player responsivo */
  .lms-layout {
    grid-template-columns: 1fr;
  }

  .lms-sidebar {
    border-left: none;
    border-top: 1px solid var(--color-border);
    padding-left: 0;
    padding-top: 1.5rem;
    margin-top: 1.5rem;
  }

  /* Responsividade do Header ações de acessibilidade */
  .accessibility-bar {
    width: 100%;
    justify-content: center;
    margin-top: 0.5rem;
  }
}

@media (max-width: 480px) {
  .agenda-card {
    flex-direction: column;
  }

  .agenda-date-box {
    width: 100%;
    min-width: unset;
    padding: 0.75rem;
  }
}

/* Botão Flutuante do WhatsApp */
.whatsapp-float-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background-color: #25D366;
  color: white !important;
  border-radius: 50px;
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
  z-index: 9999;
  text-decoration: none !important;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.whatsapp-float-btn:hover {
  transform: translateY(-3px) scale(1.03);
  background-color: #20ba5a;
  box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
}

.whatsapp-icon-svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* Classes de Visibilidade Responsiva */
@media (min-width: 769px) {
  .mobile-only-block {
    display: none !important;
  }

  .mobile-only-flex {
    display: none !important;
  }
}

@media (max-width: 768px) {
  .desktop-only-block {
    display: none !important;
  }

  .mobile-only-flex {
    display: flex !important;
  }

  /* Ajustes do Cabeçalho Mobile para ser Sticky e Menor */
  .tosb-header {
    position: sticky !important;
    top: 0 !important;
    z-index: 1000 !important;
    display: flex !important;
    flex-direction: row !important;
    justify-content: space-between !important;
    align-items: center !important;
    padding: 0.5rem 1rem !important;
    background-color: var(--color-bg-card) !important;
    border-bottom: 1px solid var(--color-border) !important;
    box-shadow: var(--shadow-sm) !important;
  }

  .accessibility-bar {
    display: none !important;
  }

  .logo-title {
    display: none !important;
  }

  .logo-subtitle {
    display: none !important;
  }

  .logo-text::after {
    content: 'TOSB';
    font-family: var(--font-primary);
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.05em;
    color: var(--color-primary);
  }

  .logo-symbol {
    font-size: 1.5rem !important;
  }

  .nav-links {
    top: 55px !important;
    /* Ajusta para a altura do novo header menor */
  }
}

/* Transição do texto do WhatsApp */
.whatsapp-text {
  max-width: 150px;
  overflow: hidden;
  transition: max-width 0.5s ease, opacity 0.5s ease;
  white-space: nowrap;
  opacity: 1;
  display: inline-block;
}

.whatsapp-text.hidden {
  max-width: 0;
  opacity: 0;
}

.whatsapp-float-btn {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s ease, gap 0.5s ease !important;
}

.whatsapp-float-btn.text-hidden {
  padding: 0.75rem !important;
  gap: 0 !important;
}

/* Sistema de Toasts Flutuantes */
.tosb-toast-container {
  position: fixed;
  top: 75px;
  right: 20px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 400px;
  width: calc(100% - 40px);
}

.tosb-toast {
  padding: 0.85rem 1.25rem;
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  font-weight: 500;
  backdrop-filter: blur(10px);
  animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  color: #1e293b;
  font-size: 0.9rem;
}

.tosb-toast.alert-success {
  background-color: rgba(240, 253, 244, 0.95);
  border: 1px solid rgba(34, 197, 94, 0.2);
  border-left: 5px solid #22c55e;
}

.tosb-toast.alert-danger {
  background-color: rgba(254, 242, 242, 0.95);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-left: 5px solid #ef4444;
}

.toast-close-btn {
  background: none;
  border: none;
  font-size: 1.25rem;
  cursor: pointer;
  color: var(--color-text-muted);
  line-height: 1;
  padding: 0;
  transition: color 0.2s ease;
}

.toast-close-btn:hover {
  color: #0f172a;
}

@keyframes slideIn {
  from {
    transform: translateX(120%);
    opacity: 0;
  }

  to {
    transform: translateX(0);
    opacity: 1;
  }
}

/* Correção do deslocamento do menu painel no mobile */
.header-mobile-actions .nav-dropdown-content {
  position: absolute !important;
  top: 100% !important;
  right: 0 !important;
  left: auto !important;
  display: none;
  min-width: 220px !important;
  background-color: var(--color-bg-card) !important;
  box-shadow: var(--shadow-lg) !important;
  border: 1px solid var(--color-border) !important;
  z-index: 10000 !important;
}

.header-mobile-actions .nav-dropdown-content.open {
  display: block !important;
}

/* Badges de Modalidade do Curso */
.badge-modality {
  display: inline-block;
  padding: 0.25rem 0.6rem;
  font-size: 0.75rem;
  font-weight: 600;
  border-radius: var(--border-radius-sm);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.badge-modality-online {
  background-color: #e0f2fe;
  color: #0369a1;
}

.badge-modality-presencial {
  background-color: #ffedd5;
  color: #c2410c;
}

.badge-modality-hibrido {
  background-color: #f3e8ff;
  color: #6b21a8;
}

/* Trava de Prévia do Vídeo (20%) */
.video-player-container {
  position: relative;
  width: 100%;
  border-radius: var(--border-radius-md);
  overflow: hidden;
}

.video-locked-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15, 23, 42, 0.88);
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 20;
  padding: 1.5rem;
  text-align: center;
  color: #ffffff;
}

.locked-card {
  max-width: 420px;
  background-color: var(--color-bg-card);
  color: var(--color-text-main);
  padding: 2rem;
  border-radius: var(--border-radius-lg);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
}

.locked-card h3 {

  color: var(--color-primary);
  margin-top: 0.5rem;
}

.locked-card p {
  font-size: 0.92rem;
  color: var(--color-text-muted);
}




/* Finance Module Specific Styles */
.finance-sub-tabs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.finance-sub-tabs .btn {
  border-radius: 20px;
  padding: 0.4rem 1rem;
  font-size: 0.9rem;
}

.finance-kpi-grid {
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

.finance-kpi-grid .admin-stat-card {
  padding: 1.25rem;
}

.finance-kpi-grid .stat-title {
  font-size: 0.85rem;
  color: var(--color-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: bold;
}

.finance-kpi-grid .stat-value {
  font-size: 1.4rem;
  font-weight: 800;
}

/* ==========================================================================
   TOSB - GUIA TÉCNICO DE IDENTIDADE VISUAL DIGITAL v1.0 (DESIGN 2)
   Especificação completa para Design System, Cores, Tipografia e Componentes
   ========================================================================== */

.theme-tosb-v2 {
  /* Design Tokens de Cores Oficiais */
  --tosb-green-950: #07180F;
  --tosb-green-900: #0B2418;
  --tosb-green-800: #123523;
  --tosb-green-700: #214B33;

  --tosb-gold-700: #9A6A18;
  --tosb-gold-600: #B68A35;
  --tosb-gold-500: #D0A54E;
  --tosb-gold-300: #E8CC8D;

  --tosb-cream-50: #FFFDF8;
  --tosb-cream-100: #FAF2E6;
  --tosb-cream-200: #F3EADA;
  --tosb-cream-300: #DDD2BD;
  --tosb-ink: #121913;
  --tosb-muted: #625E54;
  --tosb-white: #FFFFFF;

  /* Tokens Semânticos */
  --color-bg-page: var(--tosb-cream-100);
  --color-bg-surface: var(--tosb-cream-50);
  --color-bg-brand: var(--tosb-green-950);
  --color-bg-brand-soft: var(--tosb-green-900);
  --color-text-primary: var(--tosb-ink);
  --color-text-secondary: var(--tosb-muted);
  --color-text-inverse: var(--tosb-cream-50);
  --color-accent: var(--tosb-gold-600);
  --color-accent-strong: var(--tosb-gold-700);
  --color-border: rgba(154, 106, 24, 0.30);
  --color-focus: var(--tosb-gold-500);

  /* Mapeamento para Legado */
  --color-primary: var(--tosb-green-900);
  --color-primary-light: var(--tosb-cream-200);
  --color-secondary: var(--tosb-green-950);
  --color-bg-base: var(--tosb-cream-100);
  --color-bg-card: var(--tosb-cream-50);
  --color-text-main: var(--tosb-ink);
  --color-text-muted: var(--tosb-muted);

  /* Tipografia Oficial */
  --font-display: "Oswald";
  --font-ui: "Montserrat";
  --font-serif: var(--font-display);
  --font-sans: var(--font-ui);

  /* Raios e Sombras */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --border-radius-sm: 8px;
  --border-radius-md: 14px;
  --border-radius-lg: 22px;

  --shadow-sm: 0 4px 12px rgba(7, 24, 15, 0.10);
  --shadow-md: 0 10px 28px rgba(7, 24, 15, 0.14);
  --shadow-lg: 0 16px 36px rgba(7, 24, 15, 0.20);
  --shadow-brand: 0 8px 20px rgba(7, 24, 15, 0.28);
  --shadow-gold: 0 0 0 1px rgba(182, 138, 53, .35), 0 8px 18px rgba(154, 106, 24, .16);

  /* Gradientes */
  --gradient-brand: linear-gradient(135deg, #07180F 0%, #0B2418 58%, #123523 100%);
  --gradient-gold-line: linear-gradient(90deg, transparent 0%, #B68A35 24%, #E8CC8D 50%, #B68A35 76%, transparent 100%);
  --gradient-cream: linear-gradient(180deg, #FFFDF8 0%, #FAF2E6 100%);

  background-color: var(--tosb-cream-100);
  color: var(--tosb-ink);
  font-family: var(--font-ui);
}

/* Regras de Tipografia para TOSB v2 */
.theme-tosb-v2 h1,
.theme-tosb-v2 h2,
.theme-tosb-v2 h3,
.theme-tosb-v2 .section-title,
.theme-tosb-v2 .hero-title {
  font-family: var(--font-display);
  color: var(--tosb-green-950);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.theme-tosb-v2 h4,
.theme-tosb-v2 h5,
.theme-tosb-v2 h6 {
  font-family: var(--font-ui);
  color: var(--tosb-green-900);
  font-weight: 600;
}

.theme-tosb-v2 p,
.theme-tosb-v2 span,
.theme-tosb-v2 div,
.theme-tosb-v2 li {
  font-family: var(--font-ui);
}

/* Cabeçalho Institucional - Design 2 TOSB */
.theme-tosb-v2 .tosb-header {
  background: var(--gradient-brand);
  border-bottom: 1px solid var(--tosb-gold-600);
  box-shadow: var(--shadow-brand);
  padding: 1rem 2rem;
  position: relative;
}

.theme-tosb-v2 .tosb-header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--gradient-gold-line);
  opacity: 0.75;
}

.theme-tosb-v2 .logo-title {
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 700;
  color: var(--tosb-gold-300);
  letter-spacing: 0.06em;
}

.theme-tosb-v2 .logo-subtitle {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  color: var(--tosb-cream-200);
  letter-spacing: 0.15em;
  opacity: 0.9;
}

.theme-tosb-v2 .nav-link {
  color: var(--tosb-cream-100);
  font-family: var(--font-ui);
  font-size: 0.92rem;
  font-weight: 500;
  border-radius: var(--radius-sm);
  transition: all var(--duration-normal, 220ms) ease;
}

.theme-tosb-v2 .nav-link:hover,
.theme-tosb-v2 .nav-link.active {
  color: var(--tosb-gold-300);
  background-color: var(--tosb-green-800);
  border-bottom: 2px solid var(--tosb-gold-500);
}

/* Botões do Sistema - TOSB v2 */
.theme-tosb-v2 .btn-primary {
  background: var(--tosb-green-900);
  color: var(--tosb-cream-50);
  border: 1px solid var(--tosb-gold-600);
  border-radius: var(--radius-md);
  font-family: var(--font-ui);
  font-weight: 600;
  box-shadow: var(--shadow-brand);
  transition: background-color 220ms ease, box-shadow 220ms ease, transform 160ms ease;
}

.theme-tosb-v2 .btn-primary:hover {
  background: var(--tosb-green-800);
  color: var(--tosb-cream-50);
  box-shadow: var(--shadow-gold);
  transform: translateY(-1px);
}

.theme-tosb-v2 .btn-secondary {
  background: transparent;
  color: var(--tosb-green-950);
  border: 1px solid var(--tosb-gold-600);
  border-radius: var(--radius-md);
  font-family: var(--font-ui);
  font-weight: 600;
  transition: all 220ms ease;
}

.theme-tosb-v2 .btn-secondary:hover {
  background: var(--tosb-cream-200);
  color: var(--tosb-green-900);
  border-color: var(--tosb-gold-700);
}

.theme-tosb-v2 .btn-accent {
  background: var(--tosb-gold-600);
  color: var(--tosb-green-950);
  border: 1px solid var(--tosb-gold-300);
  border-radius: var(--radius-md);
  font-family: var(--font-ui);
  font-weight: 600;
}

.theme-tosb-v2 .btn-accent:hover {
  background: var(--tosb-gold-500);
  box-shadow: var(--shadow-gold);
}

/* Cards e Superfícies Elevadas - TOSB v2 */
.theme-tosb-v2 .card,
.theme-tosb-v2 .dashboard-card,
.theme-tosb-v2 .course-card,
.theme-tosb-v2 .book-card,
.theme-tosb-v2 .stat-card {
  background-color: var(--tosb-cream-50);
  border: 1px solid rgba(182, 138, 53, 0.30);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
}

.theme-tosb-v2 .card-hover:hover,
.theme-tosb-v2 .course-card:hover,
.theme-tosb-v2 .book-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-gold);
  border-color: var(--tosb-gold-600);
}

/* Menu Lateral / Painel do Aluno - TOSB v2 */
.theme-tosb-v2 .student-sidebar,
.theme-tosb-v2 .sidebar {
  background: var(--gradient-brand);
  border-right: 1px solid rgba(182, 138, 53, 0.35);
  color: var(--tosb-cream-100);
  border-radius: var(--radius-lg);
}

.theme-tosb-v2 .sidebar-nav-item,
.theme-tosb-v2 .nav-item {
  color: var(--tosb-cream-200);
  font-family: var(--font-ui);
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: var(--radius-md);
  transition: all 200ms ease;
  min-height: 48px;
}

.theme-tosb-v2 .sidebar-nav-item.active,
.theme-tosb-v2 .nav-item.active {
  background: var(--tosb-green-800);
  color: var(--tosb-cream-50);
  border-left: 3px solid var(--tosb-gold-500);
  box-shadow: 0 4px 14px rgba(7, 24, 15, 0.3);
}

.theme-tosb-v2 .sidebar-nav-item:hover {
  background: rgba(18, 53, 35, 0.7);
  color: var(--tosb-gold-300);
}

/* Formulários e Inputs - TOSB v2 */
.theme-tosb-v2 .form-input,
.theme-tosb-v2 select.form-input,
.theme-tosb-v2 textarea.form-input {
  background-color: var(--tosb-cream-50);
  border: 1px solid var(--tosb-cream-300);
  border-radius: var(--radius-sm);
  color: var(--tosb-ink);
  font-family: var(--font-ui);
  min-height: 44px;
}

// Helper para gerar slugs legíveis de cursos
const getSlug = (title) => {
  return title
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
};

const checkIsDemo = () => {
  const pathname = window.location.pathname;
  return (
    pathname.endsWith('demo.html') ||
    window.location.protocol === 'file:' ||
    window.location.hostname === 'localhost' ||
    window.location.hostname === '127.0.0.1' ||
    !pathname.endsWith('.html')
  );
};

const getPageFromPathname = () => {
  const isDemo = checkIsDemo();
  if (isDemo) {
    const hash = window.location.hash || '#inicio';
    if (hash.startsWith('#curso/')) return 'course-detail';
    if (hash.startsWith('#aula/')) return 'course-view';
    const pageHash = hash.replace('#', '').split('?')[0];

    // Reverse lookup for hash
    const entries = Object.entries(PAGE_URLS);
    for (const [key, value] of entries) {
      if (value === pageHash) return key;
    }
    if (pageHash === 'inicio' || !pageHash) return 'home';
    return 'home';
  }

  const pathname = window.location.pathname;
  for (const [key, value] of Object.entries(PAGE_URLS)) {
    if (pathname.endsWith(`/${value}.html`) || pathname.endsWith(`/${value}`)) {
      return key;
    }
  }
  return 'home';
};

    if (!studentUser || !courseObj) {
      setError('Selecione um aluno e um curso válidos.');
      return;
    }

    const validUntil = new Date(Date.now() + days_valid * 24 * 60 * 60 * 1000).toISOString();

      id: 'unlock_' + Date.now(),

          return {

            status: 'ACTIVE',
            expires_at: validUntil,
            is_temporary: true
          };
        }
        return en;
      });

      if (!enrollmentFound) {
        updatedEnrollments.push({
          id: 'enroll_temp_' + Date.now(),
          student_id,
          course_id,
          enrolled_at: new Date().toISOString(),

        const typeInput = e.target[`payment_type_${t.id}`];
        const rateInput = e.target[`payment_rate_${t.id}`];

        if (typeInput && rateInput) {
          const newType = typeInput.value;
          const newRate = parseFloat(rateInput.value) || 0;

          // Verificar configuração atual
          const existingConfigIndex = updatedTeacherCourses.findIndex(tc => tc.teacher_id === t.id && tc.course_id === targetCourseId);
          const currentConfig = existingConfigIndex > -1 ? updatedTeacherCourses[existingConfigIndex] : null;

          // Se mudou ou é novo, adiciona ao histórico permanentemente para consulta
          if (!currentConfig || currentConfig.payment_type !== newType || currentConfig.payment_rate !== newRate) {
            const historyEntry = {
              id: 'tph-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),

            id: currentConfig ? currentConfig.id : `tc_${t.id}_${targetCourseId}`,
            teacher_id: t.id,
            course_id: targetCourseId,
            payment_type: newType,
            payment_rate: newRate,
            updated_at: new Date().toISOString()
          };

          if (existingConfigIndex > -1) {
            updatedTeacherCourses[existingConfigIndex] = newTcObj;
          } else {
            updatedTeacherCourses.push(newTcObj);
          }
        }
      });

      return {
        ...prev,
        courses: updatedCourses,
        teacher_courses: updatedTeacherCourses,
        teacher_payment_history: updatedHistory
      };

  // ADMIN: CONCILIAÇÃO OFX
  const handleConciliation = async (e) => {
    e.preventDefault();
    clearAlerts();

    if (isOfflineMode) {
      // Simulação de Parser de OFX no frontend!
      // Extrair tags <STMTTRN>
      const trnRegex = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
      const parsedTx = [];
      let m;
      while ((m = trnRegex.exec(ofxInput)) !== null) {
        const block = m[1];
        const amtMatch = block.match(/<TRNAMT>([^<\r\n]+)/i);
        const refMatch = block.match(/<REFNUM>([^<\r\n]+)/i);
        const memoMatch = block.match(/<MEMO>([^<\r\n]+)/i);

        const amt = amtMatch ? parseFloat(amtMatch[1].trim()) : 0;
        const ref = refMatch ? refMatch[1].trim() : '';
        const memo = memoMatch ? memoMatch[1].trim() : '';

        parsedTx.push({ amount: amt, ref, memo });
      }

      const results = { reconciled: [], divergent: [], unmatched: [], processedCount: parsedTx.length };

      setMockDb(prev => {
        const currentPayments = [...prev.payments];
        const currentEnrollments = [...prev.enrollments];

        parsedTx.forEach(tx => {
          const rawCode = tx.memo || tx.ref || '';
          const codeMatch = rawCode.match(/ASAAS_[A-Z0-9_]+/i);
          const code = codeMatch ? codeMatch[0].toUpperCase() : null;

          if (!code) {
            results.unmatched.push({ description: 'Transação bancária sem código Asaas', amount: tx.amount });
            return;
          }

          const payIdx = currentPayments.findIndex(p => p.transaction_code === code);
          if (payIdx === -1) {
            results.unmatched.push({ description: `Código ${code} não encontrado no LMS`, amount: tx.amount });
            return;
          }

          const p = currentPayments[payIdx];
          const bankAmt = Math.abs(tx.amount);
          const localAmt = parseFloat(p.amount);

          if (bankAmt !== localAmt) {
            results.divergent.push({ transactionCode: code, bankAmount: bankAmt, localAmount: localAmt });
            return;
          }

          // Conciliar
          if (p.status === 'PENDING') {
            currentPayments[payIdx] = { ...p, status: 'RECEIVED', paid_at: new Date().toISOString() };

            // Ativar matrícula
            const c = prev.courses.find(course => course.id === p.course_id);
            const duration = c ? c.duration_days : 180;
            const enIdx = currentEnrollments.findIndex(e => e.student_id === p.student_id && e.course_id === p.course_id);

            if (enIdx !== -1) {
              currentEnrollments[enIdx] = { ...currentEnrollments[enIdx], status: 'ACTIVE', expires_at: new Date(Date.now() + duration * 24 * 60 * 60 * 1000).toISOString() };
            } else {
              currentEnrollments.push({
                id: 'enroll_' + Date.now(),
                student_id: p.student_id,
                course_id: p.course_id,
                enrolled_at: new Date().toISOString(),
                expires_at: new Date(Date.now() + duration * 24 * 60 * 60 * 1000).toISOString(),
                status: 'ACTIVE'
              });
            }

            results.reconciled.push({ transactionCode: code, amount: bankAmt, statusChanged: true });
          } else {
            results.reconciled.push({ transactionCode: code, amount: bankAmt, statusChanged: false, message: 'Já estava confirmado' });
          }
        });

        return {
          ...prev,
          payments: currentPayments,
          enrollments: currentEnrollments
        };
      });

      setConciliationResults(results);
      setSuccess('Conciliação financeira simulada processada com sucesso!');
      loadAdminReport();
    } else {
      try {
        const res = await fetch('/api/conciliations/upload', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`

          body: JSON.stringify({ ofxContent: ofxInput })

        } else {
          setError(data.message);
        }
      } catch (err) {
        setError('Erro ao processar conciliação.');
      }
    }
  };

                                      onClick={() => setViewingClassDetails(c)}
                                      title="Ver e Gerenciar Integrantes da Turma"
                                    >
                                      👥 Integrantes
                                    </button>
                                    <button
                                      className="btn btn-secondary"
                                      style={{ padding: '0.25rem 0.5rem', fontSize: '0.8rem' }}

                                </td>
                              </tr>

                            <tr>
                              <td colSpan="7" className="text-center text-muted" style={{ padding: '2rem' }}>

                            </tr>

                        </tbody>
                      </table>

                  </div>

                {adminActiveTab === 'events' && (

                          <label className="form-label">Título do Evento</label>
                          <input className="form-input" name="title" required placeholder="Lançamento do Livro X / Grupo de Estudos" />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Tipo de Evento</label>
                          <select className="form-input" name="type">
                            <option value="Lançamento de Livro">Lançamento de Livro</option>
                            <option value="Grupo de Estudos">Grupo de Estudos</option>
                            <option value="Seminário Literário">Seminário Literário</option>
                            <option value="Aula Magna">Aula Magna</option>
                          </select>
                        </div>
                        <div className="form-group">
                          <label className="form-label">Localização / Link</label>
                          <input className="form-input" name="location" required placeholder="ex: Online via Zoom / Curitiba - PR" />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Dia (ex: 15)</label>
                          <input className="form-input" name="day" required placeholder="ex: 15" maxLength="2" />

                        <div className="form-group">
                          <label className="form-label">Mês (ex: Set)</label>
                          <input className="form-input" name="month" required placeholder="ex: Set" maxLength="3" />

                        <div style={{ gridColumn: 'span 2', marginTop: '0.5rem' }}>
                          <button className="btn btn-primary w-full" type="submit">Cadastrar Evento na Agenda</button>
                        </div>
                      </form>
                    </div>

                    {/* Listagem de Eventos */}
                    <div className="card">
                      <h3 className="mb-4">Eventos Programados</h3>
                      <div className="table-responsive">
                        <table className="lms-table">
                          <thead>
                            <tr>
                              <th>Data</th>
                              <th>Tipo</th>
                              <th>Título</th>
                              <th>Local</th>
                              <th>Ações</th>
                            </tr>
                          </thead>
                          <tbody>
                            {(mockDb.events || []).map(event => (
                              <tr key={event.id}>
                                <td><strong>{event.day} {event.month}</strong></td>
                                <td><span className="course-type-badge">{event.type}</span></td>
                                <td><strong>{event.title}</strong></td>
                                <td>{event.location}</td>
                                <td>
                                  <button
                                    className="btn btn-danger"
                                    style={{ padding: '0.25rem 0.5rem', fontSize: '0.8rem' }}
                                    onClick={() => handleDeleteEvent(event.id)}
                                  >
                                    Excluir
                                  </button>
                                </td>
                              </tr>
                            ))}
                            {(mockDb.events || []).length === 0 && (
                              <tr>
                                <td colSpan="5" className="text-center text-muted" style={{ padding: '2rem' }}>Nenhum evento agendado.</td>
                              </tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {adminActiveTab === 'temp_unlock' && (
                  <div className="card">
                    <div className="quiz-header mb-4">
                      <h3>🔓 Gestão de Liberações Temporárias (Alunos Inadimplentes)</h3>
                      <button className="btn btn-secondary btn-quick-login" onClick={checkCourseExpirations}>
                        🔔 Executar Varredura de Vencimentos (2 Dias Antes)
                      </button>
                    </div>
                    <p className="course-card-description mb-4">
                      Conceda autorização de acesso temporário a cursos para alunos com inadimplência financeira ou em negociação. Um e-mail de confirmação será enviado automaticamente ao aluno.
                    </p>

                    {/* Form de Concessão de Liberação Temporária */}

                      <h4 className="mb-3" style={{ color: 'var(--color-primary)' }}>Conceder Nova Liberação Temporária</h4>

                      <div className="grid-2col mb-3">
                        <div className="form-group">
                          <label className="form-label">Selecionar Aluno Inadimplente / Cadastrado</label>
                          <select className="form-input" name="student_id" required defaultValue="">
                            <option value="" disabled>-- Escolha o aluno --</option>
                            {mockDb.users.filter(u => u.role === 'STUDENT').map(st => {
                              const isDelinquent = st.status === 'SUSPENDED' || mockDb.payments.some(p => p.student_id === st.id && p.status === 'OVERDUE');
                              return (
                                <option key={st.id} value={st.id}>
                                  {st.name} ({st.email}) {isDelinquent ? '⚠️ INADIMPLENTE' : '✓ ATIVO'}
                                </option>
                              );
                            })}
                          </select>
                        </div>

                        <div className="form-group">
                          <label className="form-label">Curso Liberado</label>
                          <select className="form-input" name="course_id" required defaultValue="">
                            <option value="" disabled>-- Escolha o curso --</option>
                            {mockDb.courses.map(c => (
                              <option key={c.id} value={c.id}>{c.title}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid-2col mb-3">
                        <div className="form-group">
                          <label className="form-label">Período de Liberação (Quantidade de Dias)</label>
                          <select className="form-input" name="days_valid" defaultValue="7" required>
                            <option value="3">3 Dias de Acesso</option>
                            <option value="7">7 Dias de Acesso (Padrão)</option>
                            <option value="15">15 Dias de Acesso</option>
                            <option value="30">30 Dias de Acesso</option>
                            <option value="60">60 Dias de Acesso</option>
                          </select>
                        </div>

                        <div className="form-group">
                          <label className="form-label">Motivo / Observação da Diretoria</label>
                          <input className="form-input" name="reason" placeholder="ex: Acordo de parcelamento efetuado via boleto" required />
                        </div>
                      </div>

                      <button className="btn btn-primary w-full" type="submit">
                        🔓 Liberar Acesso do Aluno & Disparar E-mail de Confirmação
                      </button>
                    </form>

                    {/* Tabela de Liberações Ativas e Histórico */}

                      <table className="lms-table">

                          <tr>
                            <th>Aluno</th>
                            <th>Curso</th>
                            <th>Período</th>
                            <th>Válido até</th>
                            <th>Motivo/Observação</th>
                            <th>Ações</th>
                          </tr>

                              <td><span className="badge-paid">{u.days_valid} dias</span></td>
                              <td><strong>{new Date(u.valid_until).toLocaleDateString('pt-BR')}</strong></td>
                              <td><small>{u.reason}</small></td>

                                  className="btn btn-danger"
                                  style={{ padding: '0.25rem 0.5rem', fontSize: '0.8rem' }}

                            </tr>

                      </button>

                    </p>

                    {/* Formulário de Disparo da Oferta */}

                      <h4 className="mb-3" style={{ color: 'var(--color-primary)' }}>Criar Nova Campanha de E-mail Marketing</h4>

                        <div className="form-group">
                          <label className="form-label">Título Interno da Oferta / Campanha</label>
                          <input className="form-input" name="title" placeholder="ex: Lançamento Curso Introdução à Homeopatia 2" required />

                        <div className="form-group">
                          <label className="form-label">Público Alvo (Alunos com Aceite de Promoções)</label>

                          rows={6}

                          placeholder="Digite o texto da oferta de forma atrativa...&#10;&#10;Ex: Olá! Temos o prazer de convidar você para a 2ª turma do Curso Avançado de Introdução à Homeopatia. Acesse a plataforma TOSB para garantir sua vaga com 10% de desconto."
                        />
                      </div>

                      <button className="btn btn-primary w-full" type="submit">

                      </button>
                    </form>

                      <div className="grid-2col">
                        <div>
                          <strong>Total de Alunos no Sistema:</strong> {mockDb.users.filter(u => u.role === 'STUDENT').length}

                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        )}

                  🎉 Simular Compra de Curso

                <button

                  🔓 Simular E-mail de Liberação Temporária
                </button>
              </div>
            </div>

            {/* Listagem de E-mails Registrados */}
            <div className="emails-list" style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
              {(mockDb.sent_emails || []).map((mail, idx) => (
                <div key={mail.id || idx} style={{ border: '1px solid var(--color-border)', borderRadius: '8px', padding: '1rem', backgroundColor: '#fff', boxShadow: '0 2px 4px rgba(0,0,0,0.02)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '0.5rem' }}>
                    <div>
                      <span className={`badge-paid ${mail.type === 'COURSE_PURCHASE' ? '' : mail.type === 'TEMP_UNLOCK' ? 'badge-pending' : 'badge-overdue'}`} style={{ fontSize: '0.75rem', display: 'inline-block', marginBottom: '0.25rem' }}>
                        {mail.type === 'COURSE_PURCHASE' ? '🎉 COMPRA CONFIRMADA' : mail.type === 'TEMP_UNLOCK' ? '🔓 LIBERAÇÃO TEMPORÁRIA' : '⚠️ LEMBRETE DE VENCIMENTO'}
                      </span>
                      <h4 style={{ margin: '0.25rem 0 0 0', fontSize: '1rem', color: 'var(--color-primary)' }}>{mail.subject}</h4>
                    </div>
                    <small className="text-muted">{new Date(mail.sent_at).toLocaleString('pt-BR')}</small>
                  </div>
                  <div style={{ fontSize: '0.85rem', color: 'var(--color-secondary)', marginBottom: '0.5rem' }}>
                    <strong>Para:</strong> {mail.recipient_name ? `${mail.recipient_name} <${mail.recipient_email}>` : mail.recipient_email}
                  </div>
                  <div style={{ backgroundColor: '#f8fafc', padding: '0.75rem', borderRadius: '6px', fontSize: '0.85rem', whiteSpace: 'pre-wrap', fontFamily: 'monospace', color: '#334155' }}>
                    {mail.body}
                  </div>
                </div>
              ))}
              {(mockDb.sent_emails || []).length === 0 && (
                <div className="text-center p-6 text-muted">
                  Nenhum e-mail registrado na simulação ainda. Efetue uma compra, liberação temporária ou teste rápido acima.
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Rodapé TOSB */}
      <footer className="tosb-footer">
        <div className="footer-grid">
          <div className="footer-section">
            <h4>Sobre Nós</h4>
            <p className="footer-about-text">
              Plataforma autorizada The Other Song no Brasil. Compromisso científico no ensino acadêmico da Homeopatia e do Método Sensação.
            </p>
          </div>
          <div className="footer-section">
            <h4>Cursos Livres</h4>
            <ul className="footer-links">
              <li><a href={getLinkHref('course-detail', 'id=course-free')} className="footer-link" onClick={(e) => { e.preventDefault(); clearAlerts(); navigateTo('course-detail', 'id=course-free'); }}>Princípios da Homeopatia</a></li>
              <li><a href={getLinkHref('course-detail', 'id=course-free')} className="footer-link" onClick={(e) => { e.preventDefault(); clearAlerts(); navigateTo('course-detail', 'id=course-free'); }}>Introdução à Sensação Vital</a></li>
            </ul>
          </div>
          <div className="footer-section">
            <h4>Pós-Graduação</h4>
            <ul className="footer-links">
              <li><a href={getLinkHref('course-detail', 'id=course-post')} className="footer-link" onClick={(e) => { e.preventDefault(); clearAlerts(); navigateTo('course-detail', 'id=course-post'); }}>Especialização Médica</a></li>
              <li><a href={getLinkHref('synergy')} className="footer-link" onClick={(e) => handleLinkClick(e, 'synergy')}>Repertorização Digital</a></li>
            </ul>
          </div>
          <div className="footer-section">
            <h4>Contato e Suporte</h4>
            <p className="footer-contact-text">
              Curitiba - PR / Brasil<br />
              suporte@tosb.com.br<br />
              Atendimento exclusivo para profissionais de saúde.
            </p>
          </div>
        </div>

        <div className="footer-bottom">
          <span>&copy; {new Date().getFullYear()} The Other Song Brasil. Todos os direitos reservados.</span>
          <span>Plataforma Desenvolvida com Elevado Rigor Acadêmico.</span>
        </div>
      </footer>
      {/* Botão Flutuante do WhatsApp */}
      <a
        href="https://wa.me/5541991112233"
        className={`whatsapp-float-btn animate-fade-in ${!showWhatsappText ? 'text-hidden' : ''}`}
        target="_blank"
        rel="noopener noreferrer"
        title="Fale Conosco no WhatsApp"
      >
        <svg className="whatsapp-icon-svg" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.724-1.455L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.963C16.578 1.98 14.116.953 11.49.951 6.058.951 1.632 5.321 1.628 10.75c-.001 1.71.463 3.384 1.34 4.877l-.994 3.633 3.737-.981zM17.11 13.99c-.27-.135-1.597-.788-1.846-.878-.25-.09-.432-.135-.612.135-.18.27-.697.878-.855 1.058-.158.18-.315.202-.585.067-.27-.135-1.14-.42-2.172-1.34-.803-.717-1.346-1.603-1.503-1.872-.158-.27-.017-.417.118-.552.122-.122.27-.315.405-.472.135-.158.18-.27.27-.45.09-.18.045-.337-.022-.472-.068-.135-.612-1.474-.838-2.016-.22-.53-.442-.459-.612-.468-.158-.008-.338-.008-.517-.008-.18 0-.473.067-.72.337-.247.27-.945.923-.945 2.25 0 1.328.968 2.61 1.103 2.79.135.18 1.902 2.905 4.608 4.07 1.1.474 1.88.66 2.532.766.702.112 1.34.08 1.843.005.56-.083 1.598-.653 1.822-1.282.225-.63.225-1.17.158-1.282-.068-.113-.248-.18-.518-.315z" />

    </div>
  );
}
