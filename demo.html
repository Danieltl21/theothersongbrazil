<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulação LMS Homeopatia - The Other Song Brasil</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
  
  <!-- Fontes Premium -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- React, ReactDOM, Babel Standalone da CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      /* Cores principais - Paleta premium refinada e moderna (TOSB) */
      --color-primary: #0b3c2e;       /* Verde Floresta Escuro */
      --color-primary-light: #eef5f2; /* Verde suave muito claro */
      --color-secondary: #0f172a;     /* Slate escuro */
      --color-accent: #c5a880;        /* Ouro fosco/champagne premium */
      --color-bg-base: #faf9f6;       /* Creme/Off-white quente e confortável */
      --color-bg-card: #ffffff;       /* Branco para cartões */
      --color-text-main: #1e293b;     /* Slate escuro para excelente legibilidade (idosos) */
      --color-text-muted: #475569;    /* Cinza escuro legível para metadados */
      --color-border: #cbd5e1;        /* Borda com contraste adequado */
      --color-success: #166534;       /* Verde sucesso */
      --color-error: #9f1239;         /* Vermelho elegante para erros/bloqueios */
      --color-warning: #9a3412;       /* Laranja escuro quente */

      /* Acessibilidade */
      --font-multiplier: 1;

      /* Tipografia */
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Outfit', 'Inter', system-ui, sans-serif;

      /* Efeitos */
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.08);
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --border-radius-sm: 6px;
      --border-radius-md: 10px;
      --border-radius-lg: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg-base);
      color: var(--color-text-main);
      font-size: calc(1.05rem * var(--font-multiplier, 1));
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-serif);
      color: var(--color-secondary);
      font-weight: 600;
    }

    /* Layout Geral */
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Cabeçalho TOSB Premium */
    .tosb-header {
      background-color: var(--color-bg-card);
      border-bottom: 1px solid var(--color-border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .logo-symbol {
      font-size: 1.75rem;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--color-primary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .logo-subtitle {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    /* Navegação */
    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      background: transparent;
      border: none;
      text-decoration: none;
      color: var(--color-text-main);
      font-weight: 500;
      font-size: 0.95rem;
      transition: var(--transition-smooth);
      padding: 0.5rem 0.75rem;
      border-radius: var(--border-radius-sm);
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--color-primary);
      background-color: var(--color-primary-light);
    }

    /* Botões */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1.25rem;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--border-radius-md);
      border: none;
      cursor: pointer;
      transition: var(--transition-smooth);
      text-decoration: none;
      gap: 0.5rem;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: #043a2c;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(6, 78, 59, 0.2);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text-main);
    }

    .btn-secondary:hover {
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      border-color: var(--color-primary);
    }

    .btn-danger {
      background-color: var(--color-error);
      color: white;
    }

    .btn-danger:hover {
      background-color: #9d0c32;
    }

    /* Cards Premium */
    .card {
      background-color: var(--color-bg-card);
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--color-border);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      transition: var(--transition-smooth);
    }

    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--color-primary-light);
    }

    /* Grid layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    /* Containers e Áreas principais */
    .main-content {
      flex: 1;
      padding: 2.5rem 2rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* Rodapé Sophisticated */
    .tosb-footer {
      background-color: var(--color-secondary);
      color: #94a3b8;
      padding: 3rem 2rem 1.5rem;
      margin-top: auto;
      border-top: 4px solid var(--color-primary);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2.5rem;
      max-width: 1200px;
      margin: 0 auto;
      padding-bottom: 2rem;
      border-bottom: 1px solid #334155;
    }

    .footer-section h4 {
      color: white;
      margin-bottom: 1.25rem;
      font-size: 1.1rem;
    }

    .footer-links {
      list-style: none;
    }

    .footer-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 0.6rem;
      transition: var(--transition-smooth);
    }

    .footer-link:hover {
      color: var(--color-accent);
      padding-left: 4px;
    }

    .footer-bottom {
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    /* Alertas estilo GitHub */
    .alert {
      padding: 1rem 1.25rem;
      border-radius: var(--border-radius-md);
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      font-size: 0.92rem;
    }

    .alert-danger {
      background-color: #fff1f2;
      border: 1px solid #fecdd3;
      color: var(--color-error);
    }

    .alert-success {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: var(--color-success);
    }

    .alert-warning {
      background-color: #fffbeb;
      border: 1px solid #fde68a;
      color: var(--color-warning);
    }

    /* Modais / Telas de Login */
    .auth-box {
      max-width: 480px;
      width: 100%;
      margin: 3rem auto;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-main);
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: var(--border-radius-md);
      border: 1px solid var(--color-border);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      transition: var(--transition-smooth);
      background-color: #fafafa;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-primary);
      background-color: white;
      box-shadow: 0 0 0 3px rgba(6, 78, 59, 0.1);
    }

    .terms-container {
      max-height: 150px;
      overflow-y: scroll;
      border: 1px solid var(--color-border);
      padding: 0.75rem;
      border-radius: var(--border-radius-sm);
      background-color: #f8fafc;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }

    /* Estilos de Player e Quiz */
    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000;
      border-radius: var(--border-radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      margin-bottom: 1.5rem;
    }

    .player-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .quiz-container {
      background-color: var(--color-bg-card);
      padding: 2rem;
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--color-border);
      margin-top: 2rem;
    }

    .quiz-question-card {
      margin-bottom: 1.75rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px dashed var(--color-border);
    }

    .quiz-question-text {
      font-size: 1.05rem;
      margin-bottom: 1rem;
      color: var(--color-secondary);
    }

    .quiz-option-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-md);
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .quiz-option-label:hover {
      background-color: var(--color-primary-light);
      border-color: var(--color-primary);
    }

    .quiz-option-label.selected {
      background-color: var(--color-primary-light);
      border-color: var(--color-primary);
      font-weight: 600;
    }

    /* Badge de Modo de Simulação */
    .offline-mode-badge {
      background-color: #fffbeb;
      border: 1px solid #fde68a;
      color: #b45309;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    /* Identificadores e Textos Auxiliares */
    .user-greeting {
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .main-content-top {
      padding-bottom: 0;
    }

    .text-center {
      text-align: center;
    }

    .w-full {
      width: 100%;
    }

    .flex-1 { flex: 1; }
    .flex-2 { flex: 2; }

    .cursor-pointer {
      cursor: pointer;
    }

    .pointer-events-none {
      pointer-events: none;
    }

    /* Margens utilitárias */
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-5 { margin-bottom: 1.5rem; }
    .mb-6 { margin-bottom: 2rem; }
    .mb-7 { margin-bottom: 2.5rem; }

    .mt-1 { margin-top: 0.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-5 { margin-top: 1.5rem; }
    .mt-6 { margin-top: 2rem; }

    /* Grid e Flex Layouts Gerais */
    .flex-center-gap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .grid-2col-wide {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 2rem;
    }

    .section-title-underlined {
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--color-primary-light);
      padding-bottom: 0.5rem;
    }

    .section-title-underlined-thin {
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.5rem;
    }

    /* Assistente de Login Rápido */
    .quick-login-container {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .quick-login-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--color-primary);
      text-transform: uppercase;
    }

    .quick-login-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn-quick-login {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }

    .helper-text {
      font-size: 0.7rem;
      color: #64748b;
    }

    /* Trava de IP no Login */
    .ip-warning-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #fff1f2;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #fecdd3;
    }

    .ip-warning-label {
      font-size: 0.8rem;
      color: var(--color-error);
      cursor: pointer;
    }

    /* Card de Largura Larga (Cadastro) */
    .auth-box-wide {
      max-width: 600px;
    }

    /* Grade de Cursos */
    .courses-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .course-card-grid {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 1.5rem;
      align-items: center;
    }

    .course-type-badge {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--color-accent);
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.25rem;
    }

    .course-card-title {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .course-card-description {
      color: var(--color-text-muted);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .course-card-expires {
      font-size: 0.8rem;
      color: #64748b;
    }

    .course-card-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: right;
    }

    .error-text-bold {
      color: var(--color-error);
      font-weight: bold;
      font-size: 0.85rem;
    }

    .muted-text-bold {
      color: var(--color-text-muted);
      font-weight: bold;
      font-size: 0.85rem;
    }

    /* Financeiro / Invoices */
    .invoices-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .invoice-card {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 0.75rem;
      background-color: #fff;
      font-size: 0.85rem;
    }

    .invoice-title {
      font-weight: bold;
      margin-bottom: 0.25rem;
    }

    .invoice-details {
      color: var(--color-text-muted);
      margin-bottom: 0.5rem;
    }

    .invoice-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-paid {
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      background-color: #dcfce7;
      color: #166534;
    }

    .badge-pending {
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      background-color: #fee2e2;
      color: #991b1b;
    }

    .invoice-ref {
      display: block;
      margin-top: 0.5rem;
      color: #64748b;
    }

    .invoice-due {
      display: block;
      color: #64748b;
    }

    /* Checkout */
    .checkout-item-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--color-primary);
      margin-top: 0.5rem;
    }

    .checkout-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    /* LMS Layout & Player */
    .lms-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 2rem;
    }

    .lesson-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .lesson-progress-meta {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .lesson-progress-badge-completed {
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      background-color: #dcfce7;
      color: #166534;
    }

    .lesson-progress-badge-pending {
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      background-color: #f1f5f9;
      color: #64748b;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .quiz-attempts-list {
      font-size: 0.85rem;
      margin-top: 0.5rem;
      padding-left: 1.25rem;
    }

    .quiz-attempt-passed {
      color: var(--color-success);
    }

    .quiz-attempt-failed {
      color: var(--color-error);
    }

    .placeholder-box {
      border: 2px dashed var(--color-border);
      border-radius: 12px;
      padding: 3rem;
      text-align: center;
      color: var(--color-text-muted);
    }

    .course-conclusion-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 2rem;
      border-left: 8px solid var(--color-success);
    }

    .lms-sidebar {
      border-left: 1px solid var(--color-border);
      padding-left: 1.5rem;
    }

    .sidebar-title {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .modules-list-container {
      margin-bottom: 1.5rem;
    }

    .module-header-title {
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-primary);
      margin-bottom: 0.5rem;
    }

    .lessons-list-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .lesson-item-sidebar {
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px solid transparent;
      background-color: #fff;
      color: var(--color-text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      transition: var(--transition-smooth);
    }

    .lesson-item-sidebar:hover {
      background-color: var(--color-primary-light);
      border-color: var(--color-primary-light);
    }

    .lesson-item-sidebar.active {
      border-color: var(--color-primary);
      background-color: var(--color-primary-light);
      color: var(--color-primary);
    }

    /* Professor Dashboard */
    .teacher-dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .table-responsive {
      overflow-x: auto;
    }

    .lms-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .lms-table th {
      padding: 0.75rem;
      border-bottom: 2px solid var(--color-border);
      color: var(--color-secondary);
    }

    .lms-table td {
      padding: 0.75rem;
      border-bottom: 1px solid var(--color-border);
    }

    .badge-status-active {
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      background-color: #dcfce7;
      color: #166534;
    }

    .badge-status-suspended {
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      background-color: #fee2e2;
      color: #991b1b;
    }

        const overdue = mockDb.payments.filter(p => p.status === 'PENDING' && p.due_date < todayStr).reduce((sum, p) => sum + p.amount, 0);
        const mrr = mockDb.payments.filter(p => p.status === 'RECEIVED' && p.course_id === 'course-sub').reduce((sum, p) => sum + p.amount, 0);

        setAdminReportData({

      const handleConciliation = (e) => {
        e.preventDefault();
        clearAlerts();

        const trnRegex = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
        const parsedTx = [];
        let m;
        while ((m = trnRegex.exec(ofxInput)) !== null) {
          const block = m[1];
          const amtMatch = block.match(/<TRNAMT>([^<\r\n]+)/i);
          const refMatch = block.match(/<REFNUM>([^<\r\n]+)/i);
          const memoMatch = block.match(/<MEMO>([^<\r\n]+)/i);

          const amt = amtMatch ? parseFloat(amtMatch[1].trim()) : 0;
          const ref = refMatch ? refMatch[1].trim() : '';
          const memo = memoMatch ? memoMatch[1].trim() : '';
          parsedTx.push({ amount: amt, ref, memo });
        }

        const results = { reconciled: [], divergent: [], unmatched: [], processedCount: parsedTx.length };
        
        setMockDb(prev => {
          const currentPayments = [...prev.payments];
          const currentEnrollments = [...prev.enrollments];

          parsedTx.forEach(tx => {
            const rawCode = tx.memo || tx.ref || '';
            const codeMatch = rawCode.match(/ASAAS_[A-Z0-9_]+/i);
            const code = codeMatch ? codeMatch[0].toUpperCase() : null;

            if (!code) {
              results.unmatched.push({ description: 'Transação bancária sem código Asaas', amount: tx.amount });
              return;
            }

            const payIdx = currentPayments.findIndex(p => p.transaction_code === code);
            if (payIdx === -1) {
              results.unmatched.push({ description: `Código ${code} não encontrado no LMS`, amount: tx.amount });
              return;
            }

            const p = currentPayments[payIdx];
            const bankAmt = Math.abs(tx.amount);
            const localAmt = parseFloat(p.amount);

            if (bankAmt !== localAmt) {
              results.divergent.push({ transactionCode: code, bankAmount: bankAmt, localAmount: localAmt });
              return;
            }

            if (p.status === 'PENDING') {
              currentPayments[payIdx] = { ...p, status: 'RECEIVED', paid_at: new Date().toISOString() };
              
              if (p.course_id) {
                const c = prev.courses.find(course => course.id === p.course_id);
                const duration = c ? c.duration_days : 180;
                const enIdx = currentEnrollments.findIndex(e => e.student_id === p.student_id && e.course_id === p.course_id);
                
                if (enIdx !== -1) {
                  currentEnrollments[enIdx] = { ...currentEnrollments[enIdx], status: 'ACTIVE', expires_at: new Date(Date.now() + duration * 24 * 60 * 60 * 1000).toISOString() };
                } else {
                  currentEnrollments.push({
                    id: 'enroll_' + Date.now(),
                    student_id: p.student_id,
                    course_id: p.course_id,
                    enrolled_at: new Date().toISOString(),
                    expires_at: new Date(Date.now() + duration * 24 * 60 * 60 * 1000).toISOString(),
                    status: 'ACTIVE'
                  });
                }
              }
              results.reconciled.push({ transactionCode: code, amount: bankAmt, statusChanged: true });
            } else {
              results.reconciled.push({ transactionCode: code, amount: bankAmt, statusChanged: false, message: 'Já confirmado' });
            }
          });

          return { ...prev, payments: currentPayments, enrollments: currentEnrollments };
        });

        setConciliationResults(results);
        setSuccess('Conciliação financeira simulada processada com sucesso!');
        loadAdminReport();
      };

                            </div>
                          </div>
                          <div className="form-group">
                            <label className="form-label">CEP</label>
                            <input className="form-input" type="text" name="address_zip" defaultValue={user?.address_zip || ''} />
                          </div>
                          <button className="btn btn-primary w-full mt-4" type="submit">Salvar Alterações</button>
                        </form>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* PÁGINA: CHECKOUT */}
            {currentPage === 'checkout' && (
              <div className="card auth-box">
                <h2 className="section-title-underlined-thin mb-4">Finalizar Compra - Checkout</h2>
                <div className="mb-4">
                  <strong>Resumo da Compra:</strong>
                  {checkoutCourse ? (
                    <p>{checkoutCourse.title} - R$ {checkoutCourse.type === 'SUBSCRIPTION' ? '99,00/mês' : '3.600,00'}</p>
                  ) : (
                    <div>
                      {cartItems.map((item, idx) => (
                        <div key={idx}>{item.product.title} (x{item.quantity})</div>
                      ))}
                      <div className="mt-2 font-weight-bold">Total: R$ {cartItems.reduce((acc, item) => acc + (item.type === 'course' ? (item.product.type === 'SUBSCRIPTION' ? 99 : 3600) : item.product.price * item.quantity), 0).toFixed(2)}</div>
                    </div>
                  )}
                </div>

                <form onSubmit={handleProcessCheckout}>
                  <div className="form-group">
                    <label className="form-label">Forma de Pagamento</label>
                    <select className="form-input" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>
                      <option value="PIX">Pix Imediato</option>
                      <option value="CREDIT_CARD">Cartão de Crédito</option>
                      <option value="BOLETO">Boleto Bancário</option>
                      <option value="CARNE">Boleto Parcelado (Carnê)</option>
                    </select>
                  </div>
                  <div className="checkout-actions">
                    <button className="btn btn-secondary flex-1" type="button" onClick={() => setCurrentPage('cart')}>Voltar</button>
                    <button className="btn btn-primary flex-2" type="submit">Gerar Cobrança</button>
                  </div>
                </form>
              </div>
            )}

            {/* PÁGINA: LMS / CURSO E PLAYER */}
            {currentPage === 'course-view' && selectedCourse && (
              <div>
                <button className="btn btn-secondary mb-5" onClick={() => setCurrentPage('student-dash')}>← Voltar ao Dashboard</button>

                <div className="lms-layout">
                  <div>
                    <h2>{selectedCourse.course.title}</h2>
                    <p className="course-card-description mb-5">{selectedCourse.course.description}</p>
                    
                    {selectedLesson ? (
                      <div>
                        <div className="player-container">
                          <video
                            ref={videoRef}
                            key={selectedLesson.id}
                            className="player-video"
                            controls
                            src={selectedLesson.video_url}
                            onPlay={handleVideoPlay}
                            onPause={handleVideoPause}
                          />
                        </div>

                        <div className="lesson-info">
                          <h3>{selectedLesson.title}</h3>
                          <div className="lesson-progress-meta">
                            <span>Progresso: <strong>{lessonProgress ? lessonProgress.seconds_watched : 0}s</strong></span>
                            <span className={lessonProgress && lessonProgress.completed ? 'lesson-progress-badge-completed' : 'lesson-progress-badge-pending'}>
                              {lessonProgress && lessonProgress.completed ? '✓ Concluído' : 'Pendente'}
                            </span>
                          </div>
                        </div>

                        {selectedLesson.quiz ? (
                          <div className="quiz-section-wrapper">
                            <div className="quiz-header">
                              <h3>{selectedLesson.quiz.title}</h3>
                              {!quizData ? (
                                <button className="btn btn-primary" onClick={loadQuiz}>Iniciar Quiz da Aula</button>
                              ) : (
                                <button className="btn btn-secondary" onClick={() => setQuizData(null)}>Recolher Quiz</button>
                              )}
                            </div>

                            {quizData && (
                              <div className="quiz-container">
                                {quizData.attempts.length < quizData.max_attempts && !quizData.attempts.some(a => a.passed) ? (
                                  <div>
                                    {quizData.questions.map((q, idx) => (
                                      <div key={q.id} className="quiz-question-card">
                                        <div className="quiz-question-text"><strong>Questão {idx + 1}:</strong> {q.question_text}</div>
                                        {q.options.map((opt, oIdx) => (
                                          <div
                                            key={oIdx}
                                            className={`quiz-option-label ${quizAnswers[q.id] === oIdx ? 'selected' : ''}`}
                                            onClick={() => setQuizAnswers(prev => ({ ...prev, [q.id]: oIdx }))}
                                          >
                                            <span>{opt}</span>
                                          </div>
                                        ))}
                                      </div>
                                    ))}
                                    <button className="btn btn-primary w-full" onClick={submitQuiz}>Enviar Respostas</button>
                                  </div>
                                ) : (
                                  <div className="alert alert-warning">Você concluiu esta avaliação.</div>
                                )}
                              </div>
                            )}
                          </div>
                        ) : (
                          <p>Sem Quiz obrigatório.</p>
                        )}
                      </div>
                    ) : (
                      <div className="placeholder-box">🌿 Selecione uma aula ao lado para assistir à gravação.</div>
                    )}
                  </div>

                  <div className="lms-sidebar">
                    <h3 className="sidebar-title">Módulos</h3>
                    {selectedCourse.modules.map(mod => (
                      <div key={mod.id} className="modules-list-container">
                        <div className="module-header-title">{mod.title}</div>
                        <div className="lessons-list-container">
                          {mod.lessons.map(lesson => (
                            <div
                              key={lesson.id}
                              onClick={() => selectLesson(lesson)}
                              className={`lesson-item-sidebar ${selectedLesson && selectedLesson.id === lesson.id ? 'active' : ''}`}
                            >
                              <span>{lesson.title}</span>
                              <span>{lesson.completed ? '✓' : ''}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* PÁGINA: DASHBOARD DO PROFESSOR */}
            {currentPage === 'teacher-dash' && (
              <div>
                <div className="teacher-dash-header">
                  <h2>Portal do Professor</h2>
                  <button className="btn btn-secondary" onClick={loadTeacherReport}>Atualizar</button>
                </div>
                <div className="card">
                  <h3 className="mb-4">Alunos e Presenças</h3>
                  <div className="table-responsive">
                    <table className="lms-table">
                      <thead>
                        <tr>
                          <th>Aluno</th>
                          <th>Curso</th>
                          <th>Presenças</th>
                          <th>Quizzes Feitos</th>
                          <th>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        {teacherReportData.map((rep, idx) => (
                          <tr key={idx}>
                            <td>{rep.studentName}</td>
                            <td>{rep.courseTitle}</td>
                            <td>{rep.presenceCount}</td>
                            <td>{rep.quizzesPassed}</td>
                            <td>{rep.enrollmentStatus}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* PÁGINA: DASHBOARD DO ADMINISTRADOR */}
            {currentPage === 'admin-dash' && (
              <div>
                <h2>Painel do Administrador</h2>
                {adminReportData && (
                  <div className="admin-stats-grid">
                    <div className="admin-stat-card primary">
                      <span>Receita Paga</span>
                      <h2>R$ {adminReportData.summary.totalReceived.toFixed(2)}</h2>
                    </div>
                    <div className="admin-stat-card warning">
                      <span>Receita Pendente</span>
                      <h2>R$ {adminReportData.summary.totalPending.toFixed(2)}</h2>
                    </div>
                  </div>
                )}
                <div className="admin-layout">
                  <div className="card">
                    <h3>Conciliação Bancária (.OFX)</h3>
                    <button className="btn btn-secondary mt-2 mb-4" onClick={handleGenerateMockOfx}>Gerar OFX para Teste</button>
                    <form onSubmit={handleConciliation}>
                      <textarea
                        className="form-input ofx-textarea"
                        value={ofxInput}
                        onChange={(e) => setOfxInput(e.target.value)}
                        required
                      />
                      <button className="btn btn-primary w-full" type="submit">Processar Conciliação</button>
                    </form>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Rodapé TOSB */}
          <footer className="tosb-footer">
            <div className="footer-grid">
              <div className="footer-section">
                <h4>Sobre Nós</h4>
                <p className="footer-about-text">A filial brasileira autorizada da The Other Song. Compromisso científico no ensino da Homeopatia.</p>
              </div>
              <div className="footer-section">
                <h4>Contato e Suporte</h4>
                <p className="footer-contact-text">Curitiba - PR / suporte@tosb.com.br</p>
              </div>
            </div>
            <div className="footer-bottom">
              <span>&copy; {new Date().getFullYear()} The Other Song Brasil. Todos os direitos reservados.</span>
              <span>Desenvolvido para Máxima Acessibilidade.</span>
            </div>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
